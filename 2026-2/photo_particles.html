    let cameraPoints = null;
    function getCameraPoints() {
      if (cameraPoints) return cameraPoints;
      const W = 300, H = 260;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      const cx = W / 2, cy = H / 2;
      const darkBorder = '#0f172a';

      // Visor (chico, arriba)
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = darkBorder;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx - 25, cy - 65); ctx.lineTo(cx + 25, cy - 65);
      ctx.lineTo(cx + 18, cy - 42); ctx.lineTo(cx - 18, cy - 42);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cuerpo
      const roundedRect = (x, y, w, h, r) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      };
      ctx.fillStyle = '#475569';
      ctx.strokeStyle = darkBorder;
      ctx.lineWidth = 6;
      roundedRect(cx - 88, cy - 42, 176, 100, 18);
      ctx.fill();
      ctx.stroke();

      // Flash
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(cx + 62, cy - 22, 9, 0, Math.PI * 2);
      ctx.fill();

      // Lente
      ctx.fillStyle = '#0ea5e9';
      ctx.strokeStyle = darkBorder;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(cx - 10, cy + 8, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0c4a6e';
      ctx.beginPath();
      ctx.arc(cx - 10, cy + 8, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(cx - 20, cy - 2, 8, 0, Math.PI * 2);
      ctx.fill();

      cameraPoints = rasterizeColorPoints(ctx, W, H);
      return cameraPoints;
    }

    // Gráfico de barras, base de datos y lupa con dispersión — reemplazo de
    // flor/moño (fuera del repertorio, ver historial): la idea es que se
    // note que la actividad es de CIENCIA DE DATOS sin caer otra vez en la
    // red neuronal (líneas finas = se ve disperso con pocas partículas).
    // Formas sólidas y gruesas, mismo criterio que el resto del repertorio.

    let barChartPoints = null;
    function getBarChartPoints() {
      if (barChartPoints) return barChartPoints;
      const W = 300, H = 300;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      const darkBorder = '#140a28';
      const baseY = 245, barW = 42, gap = 18;

      // Fondo/Grid (Líneas finas)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 3;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(30, baseY - i * 45);
        ctx.lineTo(W - 30, baseY - i * 45);
        ctx.stroke();
      }

      const bars = [
        { h: 70, color: '#a855f7' },
        { h: 125, color: '#38bdf8' },
        { h: 100, color: '#34d399' },
        { h: 185, color: '#f59e0b' },
      ];
      const totalW = bars.length * barW + (bars.length - 1) * gap;
      let x = (W - totalW) / 2;

      // Eje base
      ctx.strokeStyle = darkBorder;
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 20, baseY);
      ctx.lineTo(x + totalW + 20, baseY);
      ctx.stroke();

      ctx.lineJoin = 'round';
      let barCenters = [];

      // Barras
      for (const bar of bars) {
        const y = baseY - bar.h;
        const r = 12;
        ctx.beginPath();
        ctx.moveTo(x, baseY - 5);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.lineTo(x + barW - r, y);
        ctx.arcTo(x + barW, y, x + barW, y + r, r);
        ctx.lineTo(x + barW, baseY - 5);
        ctx.closePath();

        ctx.fillStyle = bar.color;
        ctx.fill();
        ctx.strokeStyle = darkBorder;
        ctx.lineWidth = 6;
        ctx.stroke();

        barCenters.push({ cx: x + barW / 2, cy: y - 10 });
        x += barW + gap;
      }

      // Trendline cruzando
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(barCenters[0].cx - 35, barCenters[0].cy + 25);
      for (let i = 0; i < barCenters.length; i++) {
        ctx.lineTo(barCenters[i].cx, barCenters[i].cy);
      }
      ctx.lineTo(barCenters[barCenters.length - 1].cx + 35, barCenters[barCenters.length - 1].cy - 25);
      ctx.stroke();

      // Puntos en la trendline
      ctx.lineWidth = 4;
      ctx.strokeStyle = darkBorder;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < barCenters.length; i++) {
        ctx.beginPath();
        ctx.arc(barCenters[i].cx, barCenters[i].cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      barChartPoints = rasterizeColorPoints(ctx, W, H);
      return barChartPoints;
    }

    let databasePoints = null;
    function getDatabasePoints() {
      if (databasePoints) return databasePoints;
      const W = 260, H = 300;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      const cx = W / 2;
      const darkBorder = '#0a2540';
      const rx = 95, ry = 35;

      const diskH = 45;
      const gap = 16;
      const startY = 65;

      const colors = ['#38bdf8', '#34d399', '#a855f7'];
      const lidColors = ['#7dd3fc', '#6ee7b7', '#c084fc'];

      for (let i = 2; i >= 0; i--) {
        const topY = startY + i * (diskH + gap);
        const bottomY = topY + diskH;

        // Cuerpo
        ctx.beginPath();
        ctx.moveTo(cx - rx, topY);
        ctx.lineTo(cx - rx, bottomY);
        ctx.ellipse(cx, bottomY, rx, ry, 0, Math.PI, 0, true);
        ctx.lineTo(cx + rx, topY);
        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.strokeStyle = darkBorder;
        ctx.lineWidth = 7;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Luces de servidor
        ctx.lineWidth = 3;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - rx + 35, topY + diskH / 2 + 2, 6, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = i === 1 ? '#ef4444' : '#fde047';
        ctx.beginPath();
        ctx.arc(cx - rx + 60, topY + diskH / 2 + 2, 6, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        // Tapa
        ctx.beginPath();
        ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = lidColors[i];
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.stroke();
      }

      databasePoints = rasterizeColorPoints(ctx, W, H);
      return databasePoints;
    }

    let processorPoints = null;
    function getProcessorPoints() {
      if (processorPoints) return processorPoints;
      const W = 300, H = 300;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      const cx = W / 2, cy = H / 2;
      const darkBorder = '#140a28';

      const boardSize = 160;
      const pinLength = 32;
      const pinWidth = 24;

      // Colores
      const boardColor = '#a855f7';
      const coreColor = '#38bdf8';
      const pinColor = '#f59e0b';

      ctx.fillStyle = pinColor;
      ctx.strokeStyle = darkBorder;
      ctx.lineWidth = 8;

      // 3 pines por lado, masivos y legibles
      const offsets = [-44, 0, 44];

      for (const off of offsets) {
        // Arriba
        ctx.fillRect(cx + off - pinWidth / 2, cy - boardSize / 2 - pinLength, pinWidth, pinLength);
        ctx.strokeRect(cx + off - pinWidth / 2, cy - boardSize / 2 - pinLength, pinWidth, pinLength);
        // Abajo
        ctx.fillRect(cx + off - pinWidth / 2, cy + boardSize / 2, pinWidth, pinLength);
        ctx.strokeRect(cx + off - pinWidth / 2, cy + boardSize / 2, pinWidth, pinLength);
        // Izquierda
        ctx.fillRect(cx - boardSize / 2 - pinLength, cy + off - pinWidth / 2, pinLength, pinWidth);
        ctx.strokeRect(cx - boardSize / 2 - pinLength, cy + off - pinWidth / 2, pinLength, pinWidth);
        // Derecha
        ctx.fillRect(cx + boardSize / 2, cy + off - pinWidth / 2, pinLength, pinWidth);
        ctx.strokeRect(cx + boardSize / 2, cy + off - pinWidth / 2, pinLength, pinWidth);
      }

      // Placa principal (Board) con chaflanes en las esquinas
      ctx.fillStyle = boardColor;
      ctx.beginPath();
      const chamfer = 24;
      ctx.moveTo(cx - boardSize / 2 + chamfer, cy - boardSize / 2);
      ctx.lineTo(cx + boardSize / 2 - chamfer, cy - boardSize / 2);
      ctx.lineTo(cx + boardSize / 2, cy - boardSize / 2 + chamfer);
      ctx.lineTo(cx + boardSize / 2, cy + boardSize / 2 - chamfer);
      ctx.lineTo(cx + boardSize / 2 - chamfer, cy + boardSize / 2);
      ctx.lineTo(cx - boardSize / 2 + chamfer, cy + boardSize / 2);
      ctx.lineTo(cx - boardSize / 2, cy + boardSize / 2 - chamfer);
      ctx.lineTo(cx - boardSize / 2, cy - boardSize / 2 + chamfer);
      ctx.closePath();

      ctx.fill();
      ctx.lineWidth = 14;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 4 nodos de montaje en las esquinas
      ctx.fillStyle = '#ef4444';
      ctx.lineWidth = 5;
      const corner = boardSize / 2 - 22;
      for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        ctx.beginPath();
        ctx.arc(cx + dx * corner, cy + dy * corner, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Núcleo central gigante
      const coreSize = 74;
      ctx.fillStyle = coreColor;
      ctx.fillRect(cx - coreSize / 2, cy - coreSize / 2, coreSize, coreSize);
      ctx.lineWidth = 10;
      ctx.strokeRect(cx - coreSize / 2, cy - coreSize / 2, coreSize, coreSize);

      // Detalle interior del núcleo
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 16, cy - 16, 32, 32);
      ctx.lineWidth = 6;
      ctx.strokeRect(cx - 16, cy - 16, 32, 32);

      processorPoints = rasterizeColorPoints(ctx, W, H);
      return processorPoints;
    }

    // Destello de relleno: una estrella de 4 puntas, blanca — se retiñe al
    // azar con los colores de las gemas al colocarla (ver placeSparkle), así
    // que un solo dibujo cachado da variedad de color gratis.
    let sparklePoints = null;
    function getSparklePoints() {
      if (sparklePoints) return sparklePoints;
      const W = 120, H = 120;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      const cx = W / 2, cy = H / 2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 55);
      ctx.quadraticCurveTo(cx + 8, cy - 8, cx + 55, cy);
      ctx.quadraticCurveTo(cx + 8, cy + 8, cx, cy + 55);
      ctx.quadraticCurveTo(cx - 8, cy + 8, cx - 55, cy);
      ctx.quadraticCurveTo(cx - 8, cy - 8, cx, cy - 55);
      ctx.closePath();
      ctx.fill();

      sparklePoints = rasterizeColorPoints(ctx, W, H);
      return sparklePoints;
    }

    // Escala aplicada al bloque foto+caption para que quepa en el viewport
    let photoFitScale = 1;

    function fillPhotoTargets() {
      if (!photoData) { fillDustTargets(); return; }
      const { cells, gridCols, gridRows } = photoData;
      const photoCount = PARTICLE_COUNT - CAPTION_COUNT - LOGO_COUNT * 2
        - STICKER_COUNT * STICKER_SLOTS - SPARKLE_COUNT * SPARKLE_TOTAL;

      const cap = getCaptionPoints();
      const capSpan = cap.maxX - cap.minX;
      const capScale0 = CAPTION_WIDTH / capSpan;
      const capH = (cap.maxY - cap.minY) * capScale0;
      const cellSize0 = PHOTO_WIDTH / gridCols;
      const planeH0 = cellSize0 * gridRows;

      // Ajuste al viewport: el bloque (foto + gap + caption) llena la pantalla
      // disponible con margen. Escala en ambos sentidos — sin esto el caption
      // se cortaba abajo y la foto desaprovechaba el ancho del monitor
      const visibleH = 2 * Math.tan(THREE.MathUtils.degToRad(camera3D.fov / 2)) * camera3D.position.z;
      const visibleW = visibleH * camera3D.aspect;
      const blockH = planeH0 + CAPTION_GAP + capH;
      const blockW = Math.max(PHOTO_WIDTH, CAPTION_WIDTH);
      photoFitScale = Math.min((visibleH * 0.92) / blockH, (visibleW * 0.92) / blockW);

      const cellSize = cellSize0 * photoFitScale;
      const capScale = capScale0 * photoFitScale;
      const planeH = planeH0 * photoFitScale;
      const photoW = PHOTO_WIDTH * photoFitScale;
      const gap = CAPTION_GAP * photoFitScale;
      const topY = (planeH + gap + capH * photoFitScale) / 2;

      // Foto (una partícula por celda)
      for (let i = 0; i < photoCount; i++) {
        const i3 = i * 3;
        const cell = i < cells.length ? cells[i] : cells[(Math.random() * cells.length) | 0];
        targets[i3] = (cell.gx + 0.5) * cellSize - photoW / 2;
        targets[i3 + 1] = topY - (cell.gy + 0.5) * cellSize;
        targets[i3 + 2] = (cell.lum - 0.5) * PHOTO_DEPTH + (Math.random() - 0.5) * 0.02;
        targetColors[i3] = cell.col[0];
        targetColors[i3 + 1] = cell.col[1];
        targetColors[i3 + 2] = cell.col[2];
      }

      // Caption: gradiente morado→cian de izquierda a derecha + destellos blancos
      const capCenterX = (cap.minX + cap.maxX) / 2;
      const capTopY = topY - planeH - gap;
      const captionEnd = photoCount + CAPTION_COUNT;
      for (let i = photoCount; i < captionEnd; i++) {
        const i3 = i * 3;
        const p = cap.pts[(Math.random() * cap.pts.length) | 0];
        targets[i3] = (p[0] - capCenterX) * capScale;
        targets[i3 + 1] = capTopY - (p[1] - cap.minY) * capScale;
        targets[i3 + 2] = (Math.random() - 0.5) * 0.02;
        if (Math.random() < 0.06) { // sparkles
          targetColors[i3] = 1;
          targetColors[i3 + 1] = 1;
          targetColors[i3 + 2] = 1;
        } else {
          const nx = (p[0] - cap.minX) / capSpan; // #c084fc → #38bdf8
          targetColors[i3] = 0.75 - 0.53 * nx;
          targetColors[i3 + 1] = 0.52 + 0.22 * nx;
          targetColors[i3 + 2] = 0.99 - 0.02 * nx;
        }
      }

      // Logo (cerebro + circuito): uno a cada lado de la foto, cerca de su
      // centro vertical pero no clavado — cada lado sale con su propia
      // inclinación y posición (ver placeLogo) para que se sienta como un
      // sticker pegado a mano, no una copia espejada perfecta. Tamaño
      // limitado por dos cosas — el espacio real libre entre la foto y el
      // borde de pantalla, y una fracción máxima de la altura de la foto —
      // para que nunca compita en tamaño con la foto ni se salga de la
      // pantalla en monitores angostos.
      const logo = getLogoPoints();
      const logoSpanX = logo.maxX - logo.minX;
      const logoSpanY = logo.maxY - logo.minY;
      const logoAspect = logoSpanY / logoSpanX;
      // Cota real para que quepa incluso en el peor caso: máxima inclinación
      // (±LOGO_TILT_MAX_DEG) + máximo jitter de margen (LOGO_X_JITTER) a la
      // vez. cx (en placeLogo) se calcula SIN rotar, con logoW/2 de por
      // medio; el borde real más lejano después de rotar un ángulo θ queda
      // a cx + logoW·(|cosθ|/2 + aspect·|senθ|/2) del origen — por eso el
      // divisor de abajo es 0.5 (el logoW/2 de cx) + esa protrusión extra.
      // Se usa el ángulo máximo real (no "cualquier ángulo", que sería más
      // conservador de lo necesario y le quitaría tamaño al logo sin razón).
      const tiltRad = LOGO_TILT_MAX_DEG * Math.PI / 180;
      const protrusionFactor = 0.5 + 0.5 * Math.cos(tiltRad) + 0.5 * logoAspect * Math.sin(tiltRad);
      const marginJitterMax = LOGO_MARGIN * (1 + LOGO_X_JITTER);
      // Piso mínimo solo para evitar tamaño 0/negativo (matemática degenerada);
      // deliberadamente chico — en pantallas angostas (formato vertical) el
      // logo debe achicarse de verdad, no desbordar el borde de la pantalla
      const sideRoomRaw = Math.max(0.02, (visibleW * 0.92) / 2 - photoW / 2 - marginJitterMax * photoFitScale);
      const sideRoom = sideRoomRaw / protrusionFactor;
      const maxLogoH = planeH * LOGO_MAX_HEIGHT_RATIO;
      const logoW = Math.min(sideRoom, maxLogoH / logoAspect);
      const logoScale = logoW / logoSpanX;
      const logoCenterX = logo.minX + logoSpanX / 2;
      const logoCenterY = logo.minY + logoSpanY / 2;
      const logoBaseCY = topY - planeH / 2; // centro vertical de la foto (referencia, no punto fijo)

      // side: -1 = izquierda, +1 = derecha. Misma nube de puntos, mismo
      // tamaño — cada lado tira su propia inclinación (±LOGO_TILT_MAX_DEG) y
      // se desplaza un poco vertical/horizontalmente, sorteado de nuevo en
      // cada captura para que no se repita siempre igual. El jitter horizontal
      // solo toca el margen (no photoW/2 ni logoW/2, que ya están al límite
      // seguro con sideRoom) — así nunca puede empujar el logo fuera de pantalla.
      function placeLogo(startIdx, endIdx, side) {
        const angle = (Math.random() * 2 - 1) * LOGO_TILT_MAX_DEG * Math.PI / 180;
        const cos = Math.cos(angle), sin = Math.sin(angle);
        const marginJitter = LOGO_MARGIN * (1 + (Math.random() * 2 - 1) * LOGO_X_JITTER);
        const cx = side * (photoW / 2 + marginJitter * photoFitScale + logoW / 2);
        const cy = logoBaseCY + (Math.random() * 2 - 1) * LOGO_Y_JITTER * planeH;
        for (let i = startIdx; i < endIdx; i++) {
          const i3 = i * 3;
          const idx = (Math.random() * logo.pts.length) | 0;
          const p = logo.pts[idx];
          const col = logo.cols[idx];
          const dx = (p[0] - logoCenterX) * logoScale;
          const dy = -(p[1] - logoCenterY) * logoScale;
          // Rotar alrededor del centro propio del logo, luego mover al lugar
          targets[i3] = cx + (dx * cos - dy * sin);
          targets[i3 + 1] = cy + (dx * sin + dy * cos);
          targets[i3 + 2] = (Math.random() - 0.5) * 0.02;
          targetColors[i3] = col[0];
          targetColors[i3 + 1] = col[1];
          targetColors[i3 + 2] = col[2];
        }
      }
      placeLogo(captionEnd, captionEnd + LOGO_COUNT, -1);
      placeLogo(captionEnd + LOGO_COUNT, captionEnd + LOGO_COUNT * 2, 1);

      // Stickers decorativos: apilados junto al logo, A LOS LADOS — nunca
      // encima de la foto. 4 huecos (arriba/abajo de cada logo); en cada
      // foto se sortean 4 del repertorio de 6 sin repetir, así la
      // combinación cambia de persona a persona. Cada uno con su propia
      // inclinación al azar, igual que el logo.
      function placeSideSticker(startIdx, endIdx, sticker, sideX, cy) {
        const spanX = sticker.maxX - sticker.minX;
        const spanY = sticker.maxY - sticker.minY;
        const sizeWorld = STICKER_SIZE * photoFitScale;
        const scale = sizeWorld / spanX;
        const stCenterX = sticker.minX + spanX / 2;
        const stCenterY = sticker.minY + spanY / 2;
        const angle = (Math.random() * 2 - 1) * STICKER_TILT_MAX_DEG * Math.PI / 180;
        const cos = Math.cos(angle), sin = Math.sin(angle);
        for (let i = startIdx; i < endIdx; i++) {
          const i3 = i * 3;
          const idx = (Math.random() * sticker.pts.length) | 0;
          const p = sticker.pts[idx];
          const col = sticker.cols[idx];
          const dx = (p[0] - stCenterX) * scale;
          const dy = -(p[1] - stCenterY) * scale;
          targets[i3] = sideX + (dx * cos - dy * sin);
          targets[i3 + 1] = cy + (dx * sin + dy * cos);
          targets[i3 + 2] = (Math.random() - 0.5) * 0.02;
          targetColors[i3] = col[0];
          targetColors[i3 + 1] = col[1];
          targetColors[i3 + 2] = col[2];
        }
      }
      // Fisher-Yates parcial: n elementos al azar del arreglo, sin repetir
      function pickRandomDistinct(arr, n) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy.slice(0, n);
      }
      // Cinco franjas por lado, de arriba a abajo: sticker-arriba, hueco,
      // logo (en el medio), hueco, sticker-abajo. Usan el alto REAL de
      // pantalla (visibleH), no solo el alto de la foto — antes el rango
      // quedaba pegado al logo y todo se amontonaba encima de todo.
      const sideRefX = photoW / 2 + LOGO_MARGIN * photoFitScale + logoW / 2;
      const screenHalfH = visibleH * 0.46;
      // Aspecto más alto del repertorio (rayo, ~1.15) para el peor caso de
      // cuánto puede sobresalir un sticker verticalmente — margen de sobra,
      // no ajustado al pixel.
      const stickerHalfH = (STICKER_SIZE * photoFitScale * 1.2) / 2;
      // Paso entre franjas: reparte el espacio libre desde el logo hasta el
      // borde de pantalla en 2 pasos iguales (logo→hueco→sticker), con
      // margen de sobra (/2.4 en vez de /2) para que el sticker de arriba
      // nunca toque el borde.
      const rowStep = (screenHalfH - Math.abs(logoBaseCY) - stickerHalfH) / 2.4;
      const rowTop = logoBaseCY + rowStep * 2;
      const rowGapUpper = logoBaseCY + rowStep;
      const rowGapLower = logoBaseCY - rowStep;
      const rowBottom = logoBaseCY - rowStep * 2;

      const stickerPool = [getDiamondPoints, getRocketPoints, getPlanetPoints, getHeartPoints, getLightningPoints, getCameraPoints, getBarChartPoints, getDatabasePoints, getProcessorPoints];
      const chosenStickers = DEBUG_SHOW_ALL_STICKERS ? stickerPool : pickRandomDistinct(stickerPool, STICKER_SLOTS);
      // Catálogo de prueba: 2 filas, pegadas a los bordes superior/inferior
      // de la pantalla (nunca en el medio, ahí está la foto), repartidas en
      // tantas columnas como haga falta según el tamaño del repertorio.
      // Orden fijo (mismo que stickerPool) para poder señalar "el tercero
      // de arriba es tal", etc.
      const debugSlotPositions = () => {
        const n = chosenStickers.length;
        const topCount = Math.ceil(n / 2);
        const botCount = n - topCount;
        const rowXs = (count) => Array.from({ length: count }, (_, c) => (-0.5 + (c + 0.5) / count) * visibleW * 0.9);
        const pos = [];
        for (const x of rowXs(topCount)) pos.push([x, screenHalfH * 0.88]);
        for (const x of rowXs(botCount)) pos.push([x, -screenHalfH * 0.88]);
        return pos;
      };
      const slotPositions = DEBUG_SHOW_ALL_STICKERS ? debugSlotPositions() : [
        [-sideRefX, rowTop],    // izquierda, franja de arriba
        [-sideRefX, rowBottom], // izquierda, franja de abajo
        [sideRefX, rowTop],     // derecha, franja de arriba
        [sideRefX, rowBottom],  // derecha, franja de abajo
      ];
      let cursor = captionEnd + LOGO_COUNT * 2;
      for (let s = 0; s < STICKER_SLOTS; s++) {
        const [sx, sy] = slotPositions[s];
        placeSideSticker(cursor, cursor + STICKER_COUNT, chosenStickers[s](), sx, sy);
        cursor += STICKER_COUNT;
      }

      // Destellos de relleno: SOLO en las franjas-hueco (entre el logo y
      // cada sticker) — nunca en la franja del sticker ni la del logo, así
      // no le caen encima a nada. Color al azar de las 6 gemas.
      //
      // Reparto en cuadrícula, no puro azar: antes cada destello sorteaba su
      // posición de forma totalmente independiente dentro de la zona, y con
      // 14 tirados al azar en un espacio chico, por pura probabilidad varios
      // caían pegados o encimados entre sí (el problema de cumpleaños). Acá
      // cada zona-hueco se divide en franjas iguales, una por destello, con
      // jitter acotado a una fracción de su propia franja — así ninguno
      // puede invadir el espacio del vecino, sin importar el azar.
      const hexToRgb01 = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
      };
      const sparkle = getSparklePoints();
      const sparkleSpanX = sparkle.maxX - sparkle.minX;
      const sparkleSpanY = sparkle.maxY - sparkle.minY;
      const sparkleScale = (SPARKLE_SIZE * photoFitScale) / sparkleSpanX;
      const sparkleCenterX = sparkle.minX + sparkleSpanX / 2;
      const sparkleCenterY = sparkle.minY + sparkleSpanY / 2;
      const sparkleZoneHalfH = rowStep * 0.26; // mismo tamaño de zona-hueco que antes
      const sparkleZones = [
        [-sideRefX, rowGapUpper], [-sideRefX, rowGapLower],
        [sideRefX, rowGapUpper], [sideRefX, rowGapLower],
      ];
      const perZone = Math.max(1, Math.round(SPARKLE_TOTAL / sparkleZones.length));
      const cellH = (sparkleZoneHalfH * 2) / perZone;
      for (const [zx, zy] of sparkleZones) {
        for (let c = 0; c < perZone; c++) {
          // Centro de la franja del destello dentro de su zona + jitter
          // acotado al 35% del alto de esa franja (deja aire garantizado
          // entre destellos vecinos) — el ancho sí puede jitterear libre,
          // como no comparten franja vertical no hay con qué chocar
          const cellCenterY = zy - sparkleZoneHalfH + cellH * (c + 0.5);
          const sx = zx + (Math.random() - 0.5) * logoW * 0.55;
          const sy = cellCenterY + (Math.random() - 0.5) * cellH * 0.35;
          const angle = Math.random() * Math.PI * 2;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          const [r, g, b] = hexToRgb01(SPARKLE_COLORS[(Math.random() * SPARKLE_COLORS.length) | 0]);
          const end = cursor + SPARKLE_COUNT;
          for (let i = cursor; i < end; i++) {
            const i3 = i * 3;
            const idx = (Math.random() * sparkle.pts.length) | 0;
            const p = sparkle.pts[idx];
            const dx = (p[0] - sparkleCenterX) * sparkleScale;
            const dy = -(p[1] - sparkleCenterY) * sparkleScale;
            targets[i3] = sx + (dx * cos - dy * sin);
            targets[i3 + 1] = sy + (dx * sin + dy * cos);
            targets[i3 + 2] = (Math.random() - 0.5) * 0.02;
            targetColors[i3] = r;
            targetColors[i3 + 1] = g;
            targetColors[i3 + 2] = b;
          }
          cursor = end;
        }
      }
    }

    // ========== MODO VISUAL ==========
    function applyModeVisuals(mode) {
      if (mode === 'photo') {
        // El tamaño sigue la celda ya ajustada al viewport (photoFitScale)
        const cellSize = (PHOTO_WIDTH / photoData.gridCols) * photoFitScale;
        material.map = squareTexture;
        material.blending = THREE.NormalBlending;
        material.size = cellSize * 1.35;
        material.toneMapped = false; // colores fieles, sin ACES
        if (bloomPass) { bloomPass.strength = 0.15; bloomPass.threshold = 0.8; }
      } else { // 'dust'
        material.map = glowTexture;
        // Aditivo en color pero SIN escribir alpha: con AdditiveBlending normal
        // las partículas apagadas (negras) no suman color pero sí opacidad al
        // canvas, y al componerse sobre el video lo ensuciaban con motas negras
        material.blending = THREE.CustomBlending;
        material.blendEquation = THREE.AddEquation;
        material.blendSrc = THREE.SrcAlphaFactor;
        material.blendDst = THREE.OneFactor;
        material.blendEquationAlpha = THREE.AddEquation;
        material.blendSrcAlpha = THREE.ZeroFactor;
        material.blendDstAlpha = THREE.OneFactor;
        material.size = 0.04;
        material.toneMapped = true;
        if (bloomPass) { bloomPass.strength = 1.0; bloomPass.threshold = 0.1; }
      }
      material.needsUpdate = true;
    }

    // ========== SONIDO (Web Audio, sin archivos) ==========
    let sfxCtx = null;

    function getSfx() {
      if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
      return sfxCtx;
    }

    function makeNoiseBuffer(ctx, seconds) {
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }

    // Chasquido: golpe de ruido corto y seco + cuerpo grave
    function playSnapSound() {
      try {
        const ctx = getSfx();
        const now = ctx.currentTime;

        const noise = ctx.createBufferSource();
        noise.buffer = makeNoiseBuffer(ctx, 0.12);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 1800;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.9, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        noise.connect(hp).connect(ng).connect(ctx.destination);
        noise.start(now);

        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.5, now);
        og.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(og).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) { /* sin audio, sin drama */ }
    }

    // Whoosh: ruido filtrado con barrido (polvo llevado por el viento)
    function playWhoosh(durationS) {
      try {
        const ctx = getSfx();
        const now = ctx.currentTime;
        const dur = durationS || 1.6;

        const noise = ctx.createBufferSource();
        noise.buffer = makeNoiseBuffer(ctx, dur);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.8;
        bp.frequency.setValueAtTime(180, now);
        bp.frequency.exponentialRampToValueAtTime(900, now + dur * 0.4);
        bp.frequency.exponentialRampToValueAtTime(220, now + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.4, now + dur * 0.25);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        noise.connect(bp).connect(g).connect(ctx.destination);
        noise.start(now);
      } catch (e) { /* sin audio, sin drama */ }
    }

    // Tick del countdown (blip corto, sube de tono al acercarse el flash)
    function playTick(pitch) {
      try {
        const ctx = getSfx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = pitch || 660;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(g).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) { /* sin audio, sin drama */ }
    }

    // Campanita suave al completarse la foto
    function playChime() {
      try {
        const ctx = getSfx();
        const now = ctx.currentTime;
        [523.25, 783.99].forEach((freq, k) => {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const g = ctx.createGain();
          const t0 = now + k * 0.12;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
          osc.connect(g).connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 1);
        });
      } catch (e) { /* sin audio, sin drama */ }
    }

    // ========== WEBCAM ==========
    const videoEl = document.getElementById('cam-video');

    async function startCamera() {
      try {
        // Máxima calidad disponible en 16:9 para que el espejo se vea nítido a
        // pantalla completa y la foto tenga píxeles reales que promediar
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            aspectRatio: { ideal: 16 / 9 }
          }
        });
        videoEl.srcObject = stream;
        // Intro: el espejo se revela después del título (delay en CSS)
        videoEl.addEventListener('playing', () => videoEl.classList.add('ready'), { once: true });
        return true;
      } catch (e) {
        console.error('Camera init failed:', e);
        document.getElementById('cam-error').classList.add('visible');
        return false;
      }
    }
    startCamera();

    // ========== FRAME CONGELADO (transición continua video→partículas) ==========
    const freezeCanvas = document.getElementById('freeze-canvas');
    const freezeCtx = freezeCanvas.getContext('2d');

    function drawFreezeFrame() {
      const w = window.innerWidth, h = window.innerHeight;
      freezeCanvas.width = w;
      freezeCanvas.height = h;
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      if (!vw || !vh) return;
      // Mismo recorte que el espejo y que la foto capturada
      const crop = getCoverCrop(vw, vh);
      freezeCtx.save();
      freezeCtx.translate(w, 0);
      freezeCtx.scale(-1, 1);
      freezeCtx.drawImage(videoEl, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, w, h);
      freezeCtx.restore();
      freezeCanvas.classList.add('show');
    }

    // Borra el frame congelado con un frente irregular que acompaña la onda
    // de armado: el reflejo real se desintegra donde nacen las partículas
    function eraseFreezeWave(p) {
      const w = freezeCanvas.width, h = freezeCanvas.height;
      const soft = w * 0.14;
      const x = p * (w + soft * 2) - soft;
      freezeCtx.globalCompositeOperation = 'destination-out';
      if (x - soft > 0) {
        freezeCtx.fillStyle = 'rgba(0,0,0,1)';
        freezeCtx.fillRect(0, 0, x - soft, h);
      }
      const gx0 = Math.max(0, x - soft);
      const g = freezeCtx.createLinearGradient(gx0, 0, Math.max(gx0 + 1, x), 0);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      freezeCtx.fillStyle = g;
      freezeCtx.fillRect(gx0, 0, Math.max(1, x - gx0), h);
      // Motas: el borde se come la imagen de forma irregular
      freezeCtx.fillStyle = 'rgba(0,0,0,1)';
      for (let k = 0; k < 60; k++) {
        const rx = x + (Math.random() - 0.35) * soft * 1.3;
        const ry = Math.random() * h;
        const r = 2 + Math.random() * 11;
        freezeCtx.beginPath();
        freezeCtx.arc(rx, ry, r, 0, Math.PI * 2);
        freezeCtx.fill();
      }
      freezeCtx.globalCompositeOperation = 'source-over';
    }

    function hideFreeze() {
      freezeCanvas.classList.remove('show');
      freezeCtx.clearRect(0, 0, freezeCanvas.width, freezeCanvas.height);
    }

    // ========== MÁQUINA DE ESTADOS ==========
    // mirror → (obturador) → countdown 3-2-1 → assembling → photo → (snap) → dissolving → mirror
    let appState = 'mirror';
    let assembleStart = -1, assembleEnd = -1;
    let dissolveStart = -1, dissolveEnd = -1;
    let countdownStart = -1, countdownIdx = -1;
    // Vitrina (attract)
    let lastInteraction = 0;
    let attractKey = -1, attractWordIdx = 0, attractTextActive = false;

    function setState(s) {
      appState = s;
      document.body.dataset.state = s;
    }

    function enterMirror() {
      setState('mirror');
      resetShare();
      videoEl.classList.remove('hidden');
      hideFreeze();
      applyModeVisuals('dust');
      fillDustTargets();
      lastInteraction = clock.getElapsedTime();
      attractKey = -1;
      attractTextActive = false;
      // El botón de acciones vuelve cerrado para la siguiente persona
      document.getElementById('photo-actions').classList.remove('open');
    }

    // Obturador → cuenta regresiva en partículas sobre el espejo
    function startCountdown() {
      if (appState !== 'mirror') return;
      getSfx(); // desbloquear audio con el gesto del usuario
      countdownStart = clock.getElapsedTime();
      countdownIdx = -1;
      attractTextActive = false;
      setState('countdown');
    }

    function performCapture() {
      // Ocultar contador HTML
      document.getElementById('html-countdown').style.display = 'none';

      if (!capturePhoto()) { enterMirror(); return; }

      playSnapSound();
      playWhoosh(ASSEMBLE_SWEEP + ASSEMBLE_DURATION);

      // Congelar el último instante del espejo: el video en vivo se apaga pero
      // el reflejo queda, y se irá desintegrando con la onda de armado
      drawFreezeFrame();

      // Flash + ocultar el video en vivo
      const flash = document.getElementById('flash');
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      videoEl.classList.add('hidden');

      fillPhotoTargets();
      applyModeVisuals('photo');
      setState('assembling');
      // Coreografía del armado: el polvo llega desde arriba-derecha con
      // borde irregular, barriendo la foto de izquierda a derecha
      const posArr = geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const spread = 2.5 + Math.random() * 3.5;
        startPositions[i3] = posArr[i3] + spread * 0.8 + (Math.random() - 0.5) * 1.5;
        startPositions[i3 + 1] = posArr[i3 + 1] + spread * 0.5 + (Math.random() - 0.5) * 1.5;
        startPositions[i3 + 2] = posArr[i3 + 2] + (Math.random() - 0.5) * 1.2;
        // Onda izquierda→derecha + jitter para el frente irregular
        const nx = (targets[i3] + PHOTO_WIDTH / 2) / PHOTO_WIDTH;
        delays[i] = nx * ASSEMBLE_SWEEP + Math.random() * ASSEMBLE_JITTER;
      }

      assembleStart = clock.getElapsedTime();
      assembleEnd = assembleStart + ASSEMBLE_SWEEP + ASSEMBLE_JITTER + ASSEMBLE_DURATION;
      setState('assembling');
    }

    function doSnap() {
      hideQr();
      playSnapSound();
      playWhoosh(DISSOLVE_SWEEP + DISSOLVE_FADE);

      // Cada partícula: retraso (onda izquierda→derecha con borde irregular)
      // + vector de deriva (brisa diagonal arriba-derecha, como ceniza)
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const nx = (targets[i3] + PHOTO_WIDTH / 2) / PHOTO_WIDTH;
        delays[i] = nx * DISSOLVE_SWEEP + Math.random() * DISSOLVE_JITTER;
        drift[i3] = 0.9 + Math.random() * 0.9;          // → derecha
        drift[i3 + 1] = 0.5 + Math.random() * 1.0;      // ↑ arriba
        drift[i3 + 2] = (Math.random() - 0.5) * 0.5;
      }

      dissolveStart = clock.getElapsedTime();
      dissolveEnd = dissolveStart + DISSOLVE_SWEEP + DISSOLVE_JITTER + DISSOLVE_FADE + 0.3;
      setState('dissolving');
    }

    // Copia la obra a un canvas 2D. El buffer WebGL no se conserva entre
    // frames, así que hay que renderizar y copiar en el mismo tick.
    // El branding ya viene dentro: el caption de partículas es parte de la escena
    function grabArtwork() {
      // 1) Forzar el asentamiento de las partículas a su posición final
      // para que la foto capturada sea 100% nítida y no se vea desfasada.
      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        pos[i3] = targets[i3];
        pos[i3 + 1] = targets[i3 + 1];
        pos[i3 + 2] = targets[i3 + 2];
        col[i3] = targetColors[i3];
        col[i3 + 1] = targetColors[i3 + 1];
        col[i3 + 2] = targetColors[i3 + 2];
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      // 2) Renderizar la escena con las partículas perfectas
      if (composer) composer.render(); else renderer.render(scene, camera3D);
      const src = renderer.domElement;
      const out = document.createElement('canvas');
      out.width = src.width; out.height = src.height;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(src, 0, 0);
      return out;
    }

    // Guardar en el equipo: PNG listo para arrastrar a WhatsApp Web
    function savePhotoCard() {
      const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
      const a = document.createElement('a');
      a.download = `chasquido-${stamp}.png`;
      a.href = grabArtwork().toDataURL('image/png');
      a.click();
    }

    // ========== COMPARTIR: SUBIDA + QR ==========
    let shareUrl = null;
    let shareState = 'idle'; // idle | uploading | ready | error
    let shareTimer = null;
    let sbClient = null;

    const qrBtn = document.getElementById('qr-btn');
    const qrOverlay = document.getElementById('qr-overlay');

    function setShareState(s) {
      shareState = s;
      qrBtn.textContent = {
        idle: '📱 Descargar',
        uploading: '⏳ Preparando…',
        ready: '📱 Descargar',
        error: '⚠️ Sin conexión'
      }[s];
      qrBtn.disabled = (s !== 'ready');
      qrBtn.style.opacity = (s === 'ready') ? '1' : '0.5';
    }

    function getSupabase() {
      if (!sbClient && window.supabase && window.supabase.createClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    async function uploadArtwork() {
      const sb = getSupabase();
      if (!sb) { setShareState('error'); return; }
      setShareState('uploading');
      try {
        const canvas = grabArtwork();
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', SHARE_QUALITY));
        if (!blob) throw new Error('No se pudo generar la imagen');

        // Nombre aleatorio: la URL no se puede adivinar (son caras de personas)
        const id = (crypto.randomUUID && crypto.randomUUID()) ||
          (Date.now() + '-' + Math.random().toString(36).slice(2));
        const store = sb.storage.from(SHARE_BUCKET);

        const img = await store.upload(id + '.jpg', blob, { contentType: 'image/jpeg' });
        if (img.error) throw img.error;
        const imgUrl = store.getPublicUrl(id + '.jpg').data.publicUrl;

        // Con página de descarga configurada el QR la usa; si no, va directo
        // a la imagen (la obra ya lleva la marca dentro, en el caption)
        shareUrl = SHARE_LANDING ? `${SHARE_LANDING}?i=${id}` : imgUrl;
        setShareState('ready');
      } catch (e) {
        console.error('Subida fallida:', e);
        setShareState('error');
      }
    }

    function showQr() {
      if (shareState !== 'ready' || !shareUrl || typeof qrcode === 'undefined') return;
      const holder = document.getElementById('qr-code');
      const qr = qrcode(0, 'M');
      qr.addData(shareUrl);
      qr.make();
      holder.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      qrOverlay.classList.add('visible');
    }

    function hideQr() {
      qrOverlay.classList.remove('visible');
    }

    function resetShare() {
      if (shareTimer) { clearTimeout(shareTimer); shareTimer = null; }
      shareUrl = null;
      hideQr();
      setShareState('idle');
    }

    setShareState('idle');

    document.getElementById('shutter-btn').addEventListener('click', startCountdown);

    // Botón circular de acciones (estado foto): un toque despliega las 3
    // opciones (Descargar/Guardar/Chasquido); elegir una las vuelve a cerrar
    const actionsEl = document.getElementById('photo-actions');
    document.getElementById('actions-toggle').addEventListener('click', () => {
      actionsEl.classList.toggle('open');
    });
    document.getElementById('snap-btn').addEventListener('click', () => {
      actionsEl.classList.remove('open');
      doSnap();
    });
    document.getElementById('save-btn').addEventListener('click', () => {
      actionsEl.classList.remove('open');
      savePhotoCard();
    });
    document.getElementById('clear-db-btn').addEventListener('click', async () => {
      actionsEl.classList.remove('open');
      if (confirm('¿Seguro que quieres borrar TODAS las fotos de Supabase? Esta acción no se puede deshacer.')) {
        const sb = getSupabase();
        if (sb) {
          document.getElementById('clear-db-btn').textContent = '⏳ Borrando...';
          try {
            // Listar y borrar manualmente (más seguro con llaves anon si emptyBucket está bloqueado)
            const store = sb.storage.from(SHARE_BUCKET);
            const { data: files } = await store.list();
            if (files && files.length > 0) {
              const paths = files.map(f => f.name);
              await store.remove(paths);
            }
            alert('¡Base de datos limpiada con éxito!');
          } catch (e) {
            alert('Error al borrar: ' + e.message);
          }
          document.getElementById('clear-db-btn').textContent = '🗑 Borrar DB';
        }
      }
    });
    qrBtn.addEventListener('click', () => {
      actionsEl.classList.remove('open');
      showQr();
    });
    document.getElementById('qr-close').addEventListener('click', hideQr);
    qrOverlay.addEventListener('click', (e) => { if (e.target === qrOverlay) hideQr(); });

    // ========== MOUSE ==========
    let mouseX = 0, mouseY = 0;
    let rotX = 0, rotY = 0;
    let isDragging = false;
    let pointerNdcX = 0, pointerNdcY = 0, pointerActive = false;

    canvas.addEventListener('pointerdown', () => {
      isDragging = true;
      lastInteraction = clock.getElapsedTime();
    });
    window.addEventListener('pointerup', () => isDragging = false);
    canvas.addEventListener('pointerleave', () => pointerActive = false);
    canvas.addEventListener('pointermove', (e) => {
      pointerNdcX = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNdcY = -((e.clientY / window.innerHeight) * 2 - 1);
      pointerActive = true;
      lastInteraction = clock.getElapsedTime();
      if (!isDragging) return;
      mouseX += e.movementX * 0.003;
      mouseY += e.movementY * 0.003;
      mouseY = Math.max(-1.2, Math.min(1.2, mouseY));
    });

    // ========== FPS ==========
    let fpsFrames = 0;
    let fpsTime = performance.now();
    const fpsBadge = document.getElementById('fps-badge');

    // ========== LOOP ==========
    const clock = new THREE.Clock();
    enterMirror();

    // Precargar Unbounded para que el rasterizador de dígitos/vitrina la tenga lista
    if (document.fonts && document.fonts.load) {
      document.fonts.load('900 100px Unbounded').catch(() => { });
    }

    function animate() {
      requestAnimationFrame(animate);
      // Todo el cuerpo va en try/catch: un solo frame roto (p.ej. photoData
      // nulo en un estado inesperado) no debe congelar la instalación. Sin
      // esto, la excepción se relanzaría en cada frame para siempre con la
      // última posición ya renderizada — visualmente "atascada" aunque el
      // loop de rAF nunca se detenga.
      try {
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        fpsFrames++;
        if (performance.now() - fpsTime > 1000) {
          fpsBadge.textContent = fpsFrames + ' FPS';
          fpsFrames = 0;
          fpsTime = performance.now();
        }

        // --- Cuenta regresiva 3-2-1 ---
        if (appState === 'countdown') {
          const idx = Math.floor((t - countdownStart) / COUNTDOWN_STEP);
        if (idx > 2) {
          performCapture();
        } else if (idx !== countdownIdx) {
          countdownIdx = idx;
          playTick(600 + idx * 160); // sube de tono: 3→2→1
          
          // Actualizar el DOM en lugar de WebGL
          const countdownEl = document.getElementById('html-countdown');
          countdownEl.style.display = 'block';
          countdownEl.textContent = ['3', '2', '1'][idx];
          // Reiniciar la animación forzando un reflow
          countdownEl.style.animation = 'none';
          void countdownEl.offsetWidth;
          countdownEl.style.animation = 'popInOut 0.9s ease-in-out forwards';
        }
        }

        // --- Modo vitrina: el polvo escribe cuando nadie interactúa ---
        if (appState === 'mirror') {
          const idleFor = t - lastInteraction;
          if (idleFor > ATTRACT_IDLE) {
            const cycle = Math.floor((idleFor - ATTRACT_IDLE) / ATTRACT_PHASE);
            if (cycle !== attractKey) {
              attractKey = cycle;
              if (cycle % 2 === 0) {
                // Fase texto
                const word = ATTRACT_TEXTS[attractWordIdx % ATTRACT_TEXTS.length];
                setOverlayTextTargets(getAttractPoints(word), ATTRACT_PARTICLES, 9.5);
                attractTextActive = true;
              } else {
                // Fase polvo
                fillDustTargets();
                attractTextActive = false;
                attractWordIdx++;
              }
            }
          } else if (attractKey !== -1) {
            // Alguien volvió: dispersar el texto de inmediato
            attractKey = -1;
            attractTextActive = false;
            fillDustTargets();
          }
        }

        // Transiciones automáticas
        if (appState === 'assembling' && t > assembleEnd) {
          setState('photo');
          hideFreeze();
          mouseX = 0; mouseY = 0; // foto derecha, de frente
          playChime();
          // Subir en segundo plano: cuando la persona pida el QR ya está listo.
          // El retraso deja que los colores terminen de asentarse
          shareTimer = setTimeout(uploadArtwork, SHARE_DELAY * 1000);
        }
        if (appState === 'assembling') {
          // El reflejo congelado se desintegra siguiendo la onda de armado
          const p = (t - assembleStart) / (ASSEMBLE_SWEEP + ASSEMBLE_JITTER + ASSEMBLE_DURATION * 0.5);
          if (p >= 0) eraseFreezeWave(Math.min(1, p));
        }
        // La foto se queda en pantalla indefinidamente: solo se disuelve al
        // tocar "💥 Chasquido" (doSnap, ver el listener del botón). Nada pasa
        // por tiempo — antes se disolvía sola a los 60s (AUTO_SNAP_AFTER,
        // eliminado: se sentía como que la instalación "volvía a tomar fotos
        // sola" cada cierto tiempo, quitando control a quien maneja el stand).
        if (appState === 'dissolving' && t > dissolveEnd) {
          enterMirror();
        }

        // Repulsión 2D: proyección del cursor al plano de la foto
        let repelActive = false, repelX = 0, repelY = 0;
        if (appState === 'photo' && pointerActive) {
          const fovTan = Math.tan(THREE.MathUtils.degToRad(camera3D.fov / 2));
          repelX = pointerNdcX * fovTan * camera3D.position.z * camera3D.aspect;
          repelY = pointerNdcY * fovTan * camera3D.position.z;
          repelActive = true;
        }
        const repelR2 = REPEL_RADIUS * REPEL_RADIUS;

        // --- LOOP DE PARTÍCULAS ---
        const pos = geometry.attributes.position.array;
        const col = geometry.attributes.color.array;
        // Estado resuelto una vez: comparar strings 40.000 veces por frame es caro
        const stMirror = appState === 'mirror';
        const stCountdown = appState === 'countdown';
        const stAssembling = appState === 'assembling';
        const stPhoto = appState === 'photo';
        const stDissolving = appState === 'dissolving';
        const swayA = attractTextActive ? 0.06 : 0.5; // vaivén del polvo ambiente

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const i3 = i * 3;
          let tx = targets[i3];
          let ty = targets[i3 + 1];
          let tz = targets[i3 + 2];
          let tr = targetColors[i3];
          let tg = targetColors[i3 + 1];
          let tb = targetColors[i3 + 2];

          if (stMirror) {
            // Polvo ambiente: vaivén lento sobre el video
            // (con texto de vitrina activo el vaivén baja para que se lea)
            tx += Math.sin(t * 0.3 + phases[i]) * swayA;
            ty += Math.cos(t * 0.23 + phases[i] * 1.7) * swayA * 0.7;

            pos[i3] += (tx - pos[i3]) * LERP_SPEED;
            pos[i3 + 1] += (ty - pos[i3 + 1]) * LERP_SPEED;
            pos[i3 + 2] += (tz - pos[i3 + 2]) * LERP_SPEED;
            col[i3] += (tr - col[i3]) * LERP_SPEED;
            col[i3 + 1] += (tg - col[i3 + 1]) * LERP_SPEED;
            col[i3 + 2] += (tb - col[i3 + 2]) * LERP_SPEED;

          } else if (stCountdown) {
            // Durante el countdown DOM, las partículas WebGL simplemente
            // siguen flotando pacíficamente como en el modo espejo.
            pos[i3] += (tx - pos[i3]) * 0.08;
            pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.08;
            pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.08;
            pos[i3] += Math.sin(t * 0.5 + phases[i]) * swayA * dt;
            pos[i3 + 1] += Math.cos(t * 0.4 + phases[i]) * swayA * dt;
            col[i3] += (tr - col[i3]) * 0.1;
            col[i3 + 1] += (tg - col[i3 + 1]) * 0.1;
            col[i3 + 2] += (tb - col[i3 + 2]) * 0.1;

          } else if (stAssembling) {
            // Chasquido inverso: el polvo se condensa en la foto
            const p = (t - assembleStart - delays[i]) / ASSEMBLE_DURATION;
            const e = p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p); // smoothstep
            const wob = (1 - e) * 0.3; // turbulencia mientras vuela
            pos[i3] = startPositions[i3] + (tx - startPositions[i3]) * e + Math.sin(t * 2.7 + phases[i]) * wob;
            pos[i3 + 1] = startPositions[i3 + 1] + (ty - startPositions[i3 + 1]) * e + Math.cos(t * 3.1 + phases[i] * 1.3) * wob;
            pos[i3 + 2] = startPositions[i3 + 2] + (tz - startPositions[i3 + 2]) * e;

            // El color se enciende a medida que la partícula llega
            const cLerp = e * 0.25;
            col[i3] += (tr - col[i3]) * cLerp;
            col[i3 + 1] += (tg - col[i3 + 1]) * cLerp;
            col[i3 + 2] += (tb - col[i3 + 2]) * cLerp;

          } else if (stPhoto) {
            // Respiración sutil
            tz += Math.sin(t * BREATH_SPEED + tx * 0.6 + ty * 0.4) * BREATH_AMP;

            // Repulsión 2D del mouse
            if (repelActive) {
              const dx = tx - repelX;
              const dy = ty - repelY;
              const d2 = dx * dx + dy * dy;
              if (d2 < repelR2 && d2 > 0.0001) {
                const d = Math.sqrt(d2);
                const f = (1 - d / REPEL_RADIUS) * REPEL_STRENGTH;
                tx += (dx / d) * f;
                ty += (dy / d) * f;
              }
            }

            // Shimmer: destellos breves al azar
            const s = Math.sin(t * 2.5 + phases[i]);
            if (s > 0.999) {
              const boost = ((s - 0.999) / 0.001) * 0.5;
              tr = Math.min(1, tr + boost);
              tg = Math.min(1, tg + boost);
              tb = Math.min(1, tb + boost);
            }

            pos[i3] += (tx - pos[i3]) * LERP_SPEED;
            pos[i3 + 1] += (ty - pos[i3 + 1]) * LERP_SPEED;
            pos[i3 + 2] += (tz - pos[i3 + 2]) * LERP_SPEED;
            col[i3] += (tr - col[i3]) * LERP_SPEED;
            col[i3 + 1] += (tg - col[i3 + 1]) * LERP_SPEED;
            col[i3 + 2] += (tb - col[i3 + 2]) * LERP_SPEED;

          } else if (stDissolving) {
            // El chasquido: polvo llevado por la brisa que se desvanece
            const age = t - dissolveStart - delays[i];
            if (age > 0) {
              const speed = Math.min(age * 1.6, 2.8);
              pos[i3] += drift[i3] * speed * dt + Math.sin(t * 3.3 + phases[i]) * 0.012;
              pos[i3 + 1] += drift[i3 + 1] * speed * dt + Math.cos(t * 2.9 + phases[i] * 1.4) * 0.012;
              pos[i3 + 2] += drift[i3 + 2] * speed * dt;

              const fade = Math.max(0, 1 - age / DISSOLVE_FADE);
              col[i3] += (tr * fade - col[i3]) * 0.15;
              col[i3 + 1] += (tg * fade - col[i3 + 1]) * 0.15;
              col[i3 + 2] += (tb * fade - col[i3 + 2]) * 0.15;
            }
          }
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        // --- Rotación ---
        rotX += (mouseX - rotX) * 0.05;
        rotY += (mouseY - rotY) * 0.05;

        if (appState === 'mirror') {
          points.rotation.y = 0;
          points.rotation.x = 0;
          points.rotation.z = 0;
        } else {
          // Foto y transiciones: planas de frente, rotación suave del mouse
          points.rotation.y = rotX * 0.2;
          points.rotation.x = rotY * 0.2;
          points.rotation.z = 0;
        }

        // --- Render ---
        // El composer pinta fondo opaco: usarlo solo cuando el video está oculto.
        // En espejo y countdown se renderiza directo (fondo transparente → cámara).
        if (composer && appState !== 'mirror' && appState !== 'countdown') {
          composer.render();
        } else {
          renderer.render(scene, camera3D);
        }
      } catch (err) {
        // Recuperación al estado seguro conocido: el espejo. Así la
        // instalación se repone sola en el siguiente frame en vez de
        // quedarse atascada esperando a que alguien reinicie la página.
        console.error('Fallo en el loop de animación, recuperando al espejo:', err);
        try { enterMirror(); } catch (e2) { /* nada más que hacer */ }
      }
    }
    animate();

    // ========== UI EXTRA ==========
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) {
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      // Reencuadrar la foto: al entrar/salir de fullscreen cambia el área visible
      if (appState === 'photo' && photoData) {
        fillPhotoTargets();
        applyModeVisuals('photo');
      }
    });
  </script>
</body>

</html>
