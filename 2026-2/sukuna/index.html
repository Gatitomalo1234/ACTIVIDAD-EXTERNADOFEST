<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sukuna — figuras automáticas (1-2 manos)</title>

  <!--
    Evolución del núcleo funcional de mano (mismo archivo, se sigue
    construyendo encima en vez de bifurcar en versiones nuevas — ver
    PLAN.md). La experiencia tiene dos actos, uno solo hacia adelante: el
    chasquido del Acto 1 "olvida" todo y arranca el Acto 2 — no hay forma
    de volver al Acto 1 salvo recargando la página (pensado para una
    sesión por persona/grupo en el evento).

    ACTO 1 — tres figuras, siempre disponibles en paralelo, sin fases ni
    orden obligatorio — el sistema decide sola cuál mostrar según la pose
    de las manos (se probó una versión con fases/desbloqueos obligatorios;
    se sintió demasiado restrictiva en la práctica — una vez cumplida una
    condición no dejaba volver a las figuras anteriores hasta completar
    toda la secuencia — así que se simplificó a esto):
      - 2 manos, NINGUNA o AMBAS en pose "pistola" -> cuadrilátero
        (pulgar+índice de cada mano, 4 puntos). "Dos pistolas hacia arriba"
        es una pose válida para esto, tanto como las dos manos abiertas.
      - 1 mano -> triángulo (muñeca+índice+meñique, 3 puntos).
      - Exactamente UNA mano en pose pistola (índice extendido, resto de
        dedos doblados, pulgar separado) -> arco (ver más abajo) — con dos
        pistolas a la vez es cuadrilátero, no arco (ver arriba).
    Las figuras se FIJAN en pantalla solas: si una figura se queda quieta
    (dentro de un radio de tolerancia, no un punto exacto) un rato corto,
    se deja una copia congelada ahí — la figura viva sigue funcionando
    después. Máximo 5 copias fijadas a la vez (mismo límite en el Acto 2).
    Control manual: una mano en PUÑO no cuenta para el tracking — da
    "espacio libre" para reposicionarse sin trackear ni fijar nada.
    Gesto de borrado: PUÑO cerrado + CODO visible en cuadro, sostenidos un
    momento corto, borran todas las copias fijadas (inspirado en el video de
    referencia, adaptado para no chocar con las otras condiciones; sigue
    disponible en el Acto 2). Usa MediaPipe Pose Landmarker para el codo
    (HandLandmarker no ve más allá de la muñeca), corriendo mucho menos
    seguido que el tracking de manos para no repetir el problema de
    rendimiento que ya se resolvió. Se probaron dos alternativas antes: un
    "swipe" de mano (no se sentía claro ni confiable) y codo-solo por
    proximidad (obligaba a mostrar la palma abierta, lo que disparaba el
    modo triángulo de fondo mientras se intentaba borrar — molesto y
    confuso). Combinar con el puño resuelve ambos problemas: el puño ya
    "pausa" el tracking de manos (sin figura de por medio) y hace el gesto
    más deliberado.
    Arco y flecha: una mano en pose "pistola" (índice extendido, resto de
    dedos doblados) ancla el triángulo; la otra hace un pellizco
    (pulgar+índice) y se aleja, como tensar la cuerda — al soltar el
    pellizco con suficiente distancia, se "dispara": el triángulo sale
    volando y la pantalla entera cambia a un efecto de color (shader WebGL
    real, no filtro CSS — ver EFECTO DE COLOR: SHADER en el script). Un
    chasquido (pulgar+medio, mismo patrón de cierre-apertura rápida)
    devuelve la pantalla a la normalidad — y ese chasquido es, a propósito,
    el final del Acto 1: dispara el Acto 2 (ver resetColorEffect,
    actTwoActive).

    ACTO 2 — arranca solo, justo al chasquear. Cuadrilátero, triángulo,
    arco y la pausa por puño quedan atrás (junto con todas las copias
    fijadas hasta ese momento, que se borran automáticamente — mismo
    mecanismo que el gesto de borrado por codo). De ahí en adelante el
    único gesto que existe es dos manos ABIERTAS -> gema: primera figura
    con volumen real (las del Acto 1 son planos con Z=0). Al arrancar el
    Acto 2 la cámara se desliza sola hacia abajo hasta desaparecer del
    todo (ver startCameraSlide/updateCameraSlideAnimation, uSlideOffset en
    el shader de fondo) — de ahí en más, pantalla negra con solo la gema.
    Van CUATRO diseños de gema probados (ver PLAN.md para el historial
    completo) — los primeros tres leían landmarks individuales de dedo
    (con o sin la Z cruda de MediaPipe) y las tres, probadas en vivo, se
    veían erráticas/sin sentido: la Z de MediaPipe es el eje MENOS preciso
    de los tres, y leerla en 8 puntos independientes a la vez amplifica
    cualquier tembleque a saltos grandes de volumen; encima un anillo de
    landmarks reales se puede "retorcer" (dejar de ser un anillo válido)
    apenas los dedos no se mueven perfectamente sincronizados, que es
    prácticamente siempre.
    Diseño actual (v4): forma FIJA y reconocible —dos anillos octagonales
    regulares (geometría, nunca landmarks, así que nunca se retuercen) con
    una punta chica más allá de cada uno, silueta punta-ancho-ancho-punta—
    controlada por señales AGREGADAS y estables, no por landmarks
    individuales: la "apertura" de cada mano (un solo número — qué tan
    lejos están en promedio las puntas de los 4 dedos largos respecto a la
    muñeca, normalizado por handScale()) controla el RADIO del anillo de
    ESA mano (mano abierta ensancha esa punta, cerrada la afila, sin leer
    Z de ningún dedo); la posición de las 2 muñecas controla tamaño e
    inclinación general (ver GEM_RING_SIDES, handOpenness,
    buildGemGeometry, updateGem). La separación entre anillos se recorta a
    un máximo proporcional a su propio radio promedio
    (GEM_MAX_LENGTH_RATIO) — mismo problema ya encontrado en diseños
    anteriores: con las manos separadas (lo natural al mostrarlas) la gema
    puede quedar como un cuchillo larguísimo si no se limita la proporción
    largo/ancho.
    La gema NO se fija nunca (sin STILL_TOLERANCE ni copias congeladas) —
    solo sigue viva a las manos.
    Tres movimientos con "comando": levantar UNA mano con 1, 2 o 3 dedos
    arriba (sostenido un instante) dispara GIRO / LATIDO / SALTO
    respectivamente. Se probó primero con gestos de movimiento (girar
    rápido, abrir/cerrar rápido, subir rápido) y no se sentían bien ni
    eran fáciles de repetir a propósito — contar dedos es mucho más
    discreto y confiable de leer. Ver countExtendedFingers/
    checkGemCommands/fireGemCommand junto a updateGem.
    Sigue siendo Fase 1 en espíritu para todo: sin color de marca, sin
    decoración — validar primero que cada mecanismo se sienta bien.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #ddd; }

    #cam-video {
      /* Ya NO es lo que se ve en pantalla — es solo la fuente de textura
         para el fondo shader que se dibuja dentro de #three-canvas (ver
         EFECTO DE COLOR: SHADER en el script). El canvas la tapa por
         completo, pero tiene que seguir en el DOM y reproduciéndose para
         que WebGL pueda leer sus frames. */
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #three-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #shader-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      font-size: 11px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #444;
      padding: 10px 14px;
      width: 200px;
      color: #ddd;
    }
    #shader-controls .title { font-weight: bold; color: #fff; margin-bottom: 6px; }
    #shader-controls label { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
    #shader-controls input[type="range"] { width: 100%; margin-top: 2px; }
    #shader-controls .row { display: flex; flex-direction: column; }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 12px;
      line-height: 1.7;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #444;
      padding: 10px 14px;
      max-width: 320px;
    }
    #status .title { font-weight: bold; color: #fff; margin-bottom: 4px; }
    .ok { color: #8f8; }
    .bad { color: #f88; }
  </style>

  <!-- Import map: sin restricción de versión de Three.js (no dependemos de
       MindAR aquí) — se usa una reciente normal. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="three-canvas"></canvas>

  <div id="status">
    <div class="title">SUKUNA · figuras automáticas</div>
    <div>Núcleo funcional — sin decoración</div>
    <div id="hand-status">Manos: <span class="bad">buscando…</span></div>
    <div id="elbow-status">Codo: <span class="bad">buscando…</span></div>
    <!-- "0/5" es solo el texto inicial antes de cargar — el JS lo sobreescribe
         enseguida usando MAX_STAMPED_SHAPES, que es la fuente real del tope.
         Si ese número cambia, no hace falta tocar esta línea. -->
    <div id="stamped-status">Fijadas: 0/5</div>
    <div id="fps">-- FPS</div>
    <!-- Debug temporal para calibrar el gesto de arco en vivo — quitar
         cuando los umbrales queden confirmados (mismo patrón que se usó
         para calibrar STILL_TOLERANCE, REFERENCE_HAND_SPAN, etc). -->
    <div id="bow-debug" style="opacity:0.65; font-size:10px;"></div>
  </div>

  <!-- Panel permanente del efecto de color del arco (esquina opuesta al
       panel de estado, mismo patrón que leaderboard.html separa sus
       botones de admin). Cada slider mueve un uniform del shader en vivo,
       sin recargar — ver EFECTO DE COLOR: SHADER en el script. -->
  <div id="shader-controls">
    <div class="title">Efecto de color (arco)</div>
    <label class="row">Intensidad
      <input type="range" id="ctrl-intensity" min="0" max="1" step="0.01" value="1">
    </label>
    <label class="row">Contraste
      <input type="range" id="ctrl-contrast" min="0.5" max="2.5" step="0.01" value="1.4">
    </label>
    <label class="row">Saturación
      <input type="range" id="ctrl-saturation" min="0" max="3" step="0.01" value="1.8">
    </label>
    <label class="row">Brillo
      <input type="range" id="ctrl-brightness" min="-0.5" max="0.5" step="0.01" value="0">
    </label>
    <label class="row">Desplaz. paleta
      <input type="range" id="ctrl-palette-shift" min="-0.5" max="0.5" step="0.01" value="0">
    </label>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { HandLandmarker, PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

    // ========== FILTRO 1 EURO ==========
    // Portado de 2026-1/neon_maze.html (ya probado en producción ahí para
    // suavizar tracking de mano) — evita reinventar algo que ya funciona.
    class LowPassFilter {
      constructor(alpha) { this.alphaValue = alpha; this.lastValue = null; }
      filter(value, alpha = null) {
        if (alpha !== null) this.alphaValue = alpha;
        const s = this.lastValue === null ? value : this.alphaValue * value + (1 - this.alphaValue) * this.lastValue;
        this.lastValue = s;
        return s;
      }
    }
    class OneEuroFilter {
      constructor(freq, mincutoff = 1.0, beta = 0.0, dcutoff = 1.0) {
        this.freq = freq;
        this.mincutoff = mincutoff;
        this.beta = beta;
        this.dcutoff = dcutoff;
        this.x = new LowPassFilter(this.alpha(mincutoff));
        this.dx = new LowPassFilter(this.alpha(dcutoff));
        this.lastTime = null;
      }
      alpha(cutoff) {
        const te = 1.0 / this.freq;
        const tau = 1.0 / (2 * Math.PI * cutoff);
        return 1.0 / (1.0 + tau / te);
      }
      filter(value, timestamp = null) {
        if (this.lastTime !== null && timestamp !== null) {
          const dt = (timestamp - this.lastTime) / 1000;
          if (dt > 0) this.freq = 1.0 / dt;
        }
        this.lastTime = timestamp;
        const dvalue = this.x.lastValue === null ? 0 : (value - this.x.lastValue) * this.freq;
        const edvalue = this.dx.filter(dvalue, this.alpha(this.dcutoff));
        const cutoff = this.mincutoff + this.beta * Math.abs(edvalue);
        return this.x.filter(value, this.alpha(cutoff));
      }
    }

    // Mismos parámetros de partida que en la versión de una mano — se afinan
    // viendo cómo se comporta en vivo.
    const POS_MINCUTOFF = 0.4, POS_BETA = 0.3;

    // ========== THREE.JS ==========
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 5;

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      // bgUniforms se declara más abajo en el archivo, pero para cuando
      // este callback corra de verdad (un resize real) el módulo ya
      // terminó de inicializar todo — es seguro referenciarlo acá.
      bgUniforms.uCanvasSize.value.set(window.innerWidth, window.innerHeight);
    });

    // ========== MALLA DEFORMABLE GENÉRICA (sin color ni textura) ==========
    // Misma idea que el cuadrilátero original, generalizada para poder tener
    // varias figuras (distinto número de vértices) sin duplicar código. Cada
    // "shape" es un mesh propio con sus vértices reposicionados cada frame
    // según el tracking — no rota como objeto rígido, se DEFORMA. Se incluyen
    // UVs desde ya (no se usan todavía) para no rehacer la geometría cuando
    // llegue la textura en la fase de decoración.
    //
    // `material.transparent = true` + `opacity` es para el pop-in al
    // aparecer (ver `updatePopAnimation` más abajo) — no es decoración, es
    // parte del mecanismo de transición entre figuras.
    function createDeformableShape(vertexCount, indices, uvs) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(vertexCount * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshNormalMaterial({
        flatShading: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.visible = false;
      scene.add(mesh);

      // stillCenter/stillSince/hasStamped: estado del mecanismo de "fijado
      // por quietud" — ver checkStillness() más abajo.
      return { mesh, geometry, material, appearAt: 0, stillCenter: null, stillSince: 0, hasStamped: false };
    }

    // Cuadrilátero: 4 vértices, 2 triángulos. Layout: 0=arriba-izq,
    // 1=arriba-der, 2=abajo-izq, 3=abajo-der.
    const quadShape = createDeformableShape(
      4,
      [0, 2, 1, 1, 2, 3],
      [0, 1, 1, 1, 0, 0, 1, 0]
    );

    // Triángulo: 3 vértices, 1 triángulo. Layout: 0=muñeca, 1=índice, 2=meñique.
    const triShape = createDeformableShape(
      3,
      [0, 1, 2],
      [0, 0, 1, 0, 0.5, 1]
    );

    // Gema: primera figura con volumen real (las demás son planos), del
    // ACTO 2 (ver más abajo, sección ACTO 2). Rediseño (v4) — se probaron
    // tres versiones basadas en landmarks individuales de dedo (con o sin
    // Z cruda de MediaPipe) y las tres, probadas en vivo, se veían
    // erráticas o "sin sentido" — la Z de MediaPipe es el eje MENOS
    // preciso de los tres, y ocho puntos independientes leyéndola a la vez
    // amplifica cualquier tembleque a saltos grandes; encima un anillo de
    // landmarks reales se puede "retorcer" (dejar de ser un anillo válido)
    // apenas los dedos no se mueven perfectamente sincronizados, que es
    // prácticamente siempre. Ver historial completo en PLAN.md.
    //
    // Esta versión vuelve a una forma FIJA y reconocible —dos anillos
    // octagonales regulares (nunca se retuercen, son geometría, no
    // landmarks) con una punta chica más allá de cada uno, silueta
    // punta-ancho-ancho-punta— controlada por señales AGREGADAS y
    // estables en vez de landmarks individuales:
    //   - la "apertura" de cada mano (un solo número, ver handOpenness())
    //     controla el RADIO del anillo de ESA mano — mano abierta ensancha
    //     esa punta, mano cerrada la afila. Sin Z de dedo individual.
    //   - la posición de las 2 muñecas controla tamaño e inclinación
    //     general (mismo principio que ya usaba la viga).
    // Ver updateGem() más abajo para el armado completo.
    const GEM_RING_SIDES = 8;
    // Layout: 0 = punta izquierda, 1..GEM_RING_SIDES = anillo izquierdo,
    // GEM_RING_SIDES+1..2*GEM_RING_SIDES = anillo derecho, último = punta
    // derecha.
    function buildGemGeometry(sides) {
      const apexLeft = 0;
      const ringLeft = (i) => 1 + i;
      const ringRight = (i) => 1 + sides + i;
      const apexRight = 1 + 2 * sides;

      const indices = [];
      // Tapa izquierda: abanico desde su punta hacia su anillo.
      for (let i = 0; i < sides; i++) {
        indices.push(apexLeft, ringLeft(i), ringLeft((i + 1) % sides));
      }
      // Cintura: conecta los dos anillos índice a índice — como los dos
      // están construidos con el MISMO marco angular (ver updateGem), los
      // vértices ya quedan alineados, sin torsión ni costura rara.
      for (let i = 0; i < sides; i++) {
        const a0 = ringLeft(i), a1 = ringLeft((i + 1) % sides);
        const b0 = ringRight(i), b1 = ringRight((i + 1) % sides);
        indices.push(a0, a1, b1);
        indices.push(a0, b1, b0);
      }
      // Tapa derecha: mismo abanico del otro lado (orden invertido).
      for (let i = 0; i < sides; i++) {
        indices.push(apexRight, ringRight((i + 1) % sides), ringRight(i));
      }

      const uvs = [0.5, 0]; // punta izquierda
      for (let i = 0; i < sides; i++) uvs.push(i / sides, 0.33); // anillo izquierdo
      for (let i = 0; i < sides; i++) uvs.push(i / sides, 0.67); // anillo derecho
      uvs.push(0.5, 1); // punta derecha
      return { vertexCount: 2 * sides + 2, indices, uvs };
    }
    const gemGeo = buildGemGeometry(GEM_RING_SIDES);
    const gemShape = createDeformableShape(gemGeo.vertexCount, gemGeo.indices, gemGeo.uvs);

    // ========== CÁMARA ==========
    const videoEl = document.getElementById('cam-video');

    async function startCamera() {
      // Máxima calidad disponible (igual que CHASQUIDO): ya se midió que
      // pedir 1080p no le cuesta rendimiento en la máquina de la demo, y
      // MediaPipe/Three.js leen el tamaño real vía videoEl.videoWidth/Height
      // en cada frame — no hay ningún número fijo en otro lado que dependa
      // de esto, así que subir la resolución no rompe nada más.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          aspectRatio: { ideal: 16 / 9 },
          facingMode: 'user'
        }
      });
      videoEl.srcObject = stream;
      await new Promise((resolve) => videoEl.addEventListener('loadedmetadata', resolve, { once: true }));
      await videoEl.play();
    }

    // ========== EFECTO DE COLOR: SHADER (arco) ==========
    // Reemplaza el filtro CSS del primer intento (saturate/hue-rotate) por
    // un shader de verdad: video -> textura WebGL -> luminancia -> paleta
    // por tramos (mapeo real de color, no una capa encima) -> contraste/
    // saturación/brillo -> mezcla con el original -> salida. Se integra en
    // el mismo canvas/renderer que ya existe (sin canvas nuevo): un plano
    // de pantalla completa con cámara ortográfica se dibuja PRIMERO cada
    // frame (el video ya procesado), y las figuras (cuadrilátero/triángulo/
    // arco) se dibujan encima con la cámara perspectiva de siempre.
    //
    // El <video> HTML deja de ser lo que se ve — el canvas lo tapa por
    // completo — pero sigue en el DOM reproduciéndose porque WebGL necesita
    // leer sus frames (THREE.VideoTexture se encarga de subir cada frame
    // solo, no hace falta actualizarla a mano).
    const videoTexture = new THREE.VideoTexture(videoEl);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;

    // Uniforms expuestos en el panel #shader-controls (permanente, se puede
    // ajustar en vivo sin recargar) + los que maneja el propio código
    // (uMix, tamaños). Los valores iniciales de contraste/saturación son
    // altos a propósito — la referencia pide "colores muy saturados,
    // contraste bastante fuerte".
    const bgUniforms = {
      uVideoTexture: { value: videoTexture },
      uVideoSize: { value: new THREE.Vector2(1, 1) },
      uCanvasSize: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uMix: { value: 0 },              // 0 = video normal, 1 = efecto completo — lo mueve el arco, no el panel
      uEffectIntensity: { value: 1.0 },
      uContrast: { value: 1.4 },
      uSaturation: { value: 1.8 },
      uBrightness: { value: 0.0 },
      uPaletteShift: { value: 0.0 },
      // 0 = cámara normal, 1 = deslizada del todo fuera de cuadro (negro).
      // La anima updateCameraSlideAnimation() al entrar al Acto 2 — ver esa
      // función y ACTO 2 más abajo.
      uSlideOffset: { value: 0 }
    };

    const bgVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        // Posición local del plano (-1..1) usada directo como espacio de
        // recorte: PlaneGeometry(2,2) ya coincide con NDC, así que no hace
        // falta aplicar matrices de cámara — es el truco estándar del
        // "quad de pantalla completa".
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    // GLSL compartido entre el fondo (bgFragmentShader) y la "ventana" del
    // arco (arrowFragmentShader, ver ARCO Y FLECHA más abajo) — ambos
    // necesitan exactamente el mismo recorte/paleta/gradación, para que la
    // punta de la flecha muestre EL MISMO efecto que después inunda toda la
    // pantalla al disparar. Un solo lugar para tocar la paleta.
    const gradingGLSL = `
      uniform sampler2D uVideoTexture;
      uniform vec2 uVideoSize;
      uniform vec2 uCanvasSize;
      uniform float uEffectIntensity;
      uniform float uContrast;
      uniform float uSaturation;
      uniform float uBrightness;
      uniform float uPaletteShift;

      // Mismo recorte "cover" que getCoverCrop()/toWorld() ya usan para
      // mapear los landmarks de la mano — si no coincidiera, las figuras
      // quedarían desalineadas del video que se ve de fondo.
      vec2 coverUv(vec2 uv) {
        float videoAspect = uVideoSize.x / uVideoSize.y;
        float canvasAspect = uCanvasSize.x / uCanvasSize.y;
        vec2 scale = vec2(1.0);
        if (videoAspect > canvasAspect) {
          scale.x = canvasAspect / videoAspect;
        } else {
          scale.y = videoAspect / canvasAspect;
        }
        return (uv - 0.5) * scale + 0.5;
      }

      // Paleta por tramos inspirada en la referencia (azul oscuro -> cian ->
      // verde -> amarillo -> naranja -> magenta), interpolada con
      // smoothstep para que las transiciones sean suaves, no bruscas.
      vec3 palette(float t) {
        vec3 c0 = vec3(0.02, 0.02, 0.28); // azul oscuro (sombras)
        vec3 c1 = vec3(0.0, 0.35, 0.78);  // azul eléctrico
        vec3 c2 = vec3(0.0, 0.80, 0.85);  // cian
        vec3 c3 = vec3(0.05, 0.85, 0.35); // verde/turquesa
        vec3 c4 = vec3(0.95, 0.90, 0.10); // amarillo
        vec3 c5 = vec3(1.0, 0.50, 0.0);   // naranja
        vec3 c6 = vec3(1.0, 0.15, 0.55);  // rosa/fucsia
        vec3 c7 = vec3(0.85, 0.0, 0.80);  // magenta (highlights)

        vec3 color = c0;
        color = mix(color, c1, smoothstep(0.00, 0.20, t));
        color = mix(color, c2, smoothstep(0.20, 0.40, t));
        color = mix(color, c3, smoothstep(0.40, 0.55, t));
        color = mix(color, c4, smoothstep(0.55, 0.70, t));
        color = mix(color, c5, smoothstep(0.70, 0.82, t));
        color = mix(color, c6, smoothstep(0.82, 0.92, t));
        color = mix(color, c7, smoothstep(0.92, 1.00, t));
        return color;
      }

      // Muestrea el video (con recorte "cover") sin gradar. NO espeja acá
      // adentro a propósito — el fondo (bgFragmentShader, vUv sin cámara) y
      // la ventana del arco (arrowFragmentShader, vScreenUv CON cámara) no
      // necesitan el mismo espejo porque llegan a este punto por caminos
      // distintos: cada fragment shader espeja (o no) su propio screenUv
      // ANTES de llamar a esta función, según le corresponda.
      vec3 sampleOriginalVideo(vec2 screenUv) {
        vec2 videoUv = coverUv(screenUv);
        return texture2D(uVideoTexture, videoUv).rgb;
      }

      // Pipeline completo: luminancia real del píxel (Rec.709, no un valor
      // inventado — esto es lo que determina el color, conservando el
      // detalle original) -> paleta -> intensidad -> contraste/saturación/
      // brillo. Comparten esto el fondo Y la ventana del arco.
      vec3 sampleGradedVideo(vec2 screenUv) {
        vec3 original = sampleOriginalVideo(screenUv);
        float luminance = dot(original, vec3(0.2126, 0.7152, 0.0722));
        float t = clamp(luminance + uPaletteShift, 0.0, 1.0);
        vec3 mapped = palette(t);
        mapped = mix(vec3(luminance), mapped, uEffectIntensity);
        mapped += uBrightness;
        mapped = (mapped - 0.5) * uContrast + 0.5;
        float mappedGray = dot(mapped, vec3(0.2126, 0.7152, 0.0722));
        mapped = mix(vec3(mappedGray), mapped, uSaturation);
        return clamp(mapped, 0.0, 1.0);
      }
    `;

    const bgFragmentShader = `
      precision mediump float;
      uniform float uMix;
      uniform float uSlideOffset;
      varying vec2 vUv;
      ${gradingGLSL}
      void main() {
        // Espejo (equivalente al scaleX(-1) que antes tenía el <video> en
        // CSS) — vUv viene del plano de fondo (sin cámara, NDC directo), así
        // que hace falta espejarlo acá antes de muestrear.
        vec2 mirroredUv = vec2(1.0 - vUv.x, vUv.y);
        // uSlideOffset "empuja" el punto de muestreo hacia arriba del
        // video — cuando eso cae fuera del cuadro (>1.0), ya no hay nada
        // que mostrar ahí: negro. El efecto visual es que la cámara se va
        // deslizando hacia abajo hasta desaparecer del todo (Acto 2, ver
        // updateCameraSlideAnimation).
        vec2 slidUv = mirroredUv + vec2(0.0, uSlideOffset);
        if (slidUv.y > 1.0) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }
        // uMix: mezcla con el video sin procesar — esto es lo que anima
        // launchTriangle()/resetColorEffect() al disparar/chasquear.
        vec3 finalColor = mix(sampleOriginalVideo(slidUv), sampleGradedVideo(slidUv), uMix);
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: bgUniforms,
      vertexShader: bgVertexShader,
      fragmentShader: bgFragmentShader,
      depthTest: false,
      depthWrite: false
    });
    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.Camera(); // no se usan sus matrices — ver comentario en el vertex shader
    const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgScene.add(bgMesh);

    // "Ventana" al efecto dentro de la punta del arco — a pedido explícito:
    // que la flecha se vea como la "culpable" de que la pantalla cambie de
    // color, no que el cambio sea un interruptor plano y desconectado de
    // ella. Mientras se tensa el arco, la flecha muestra EL MISMO video
    // gradado que después inunda toda la pantalla al disparar (comparten
    // gradingGLSL y los mismos uniforms del panel — mover un slider afecta
    // a los dos por igual).
    //
    // Es un mesh SEPARADO, no un cambio de material sobre triShape.mesh:
    // comparte la geometría de triShape (mismo THREE.BufferGeometry, así
    // que sus vértices se actualizan solos cuando updateShapeVertices
    // mueve los de triShape) pero tiene su propio material — así el pop-in/
    // opacidad/quietud de triShape (showShape, hideShape, updatePopAnimation,
    // checkStillness) siguen funcionando exactamente igual que antes, sin
    // tocarlos: este mesh solo se DIBUJA ENCIMA (depthTest:false) tapando
    // visualmente a triShape.mesh mientras está activo, copiando su
    // posición/escala/opacidad cada frame — ver updateBowAndArrow() y
    // updateLaunchAnimation().
    const arrowUniforms = {
      uVideoTexture: bgUniforms.uVideoTexture,
      uVideoSize: bgUniforms.uVideoSize,
      uCanvasSize: bgUniforms.uCanvasSize,
      uEffectIntensity: bgUniforms.uEffectIntensity,
      uContrast: bgUniforms.uContrast,
      uSaturation: bgUniforms.uSaturation,
      uBrightness: bgUniforms.uBrightness,
      uPaletteShift: bgUniforms.uPaletteShift,
      uOpacity: { value: 1 }
    };
    const arrowVertexShader = `
      varying vec2 vScreenUv;
      void main() {
        // A diferencia del fondo (que ignora la cámara a propósito), acá sí
        // hace falta: la flecha se mueve/deforma con el tracking, así que
        // su posición en pantalla cambia cuadro a cuadro. projectionMatrix/
        // modelViewMatrix las inyecta Three.js solo, no hace falta
        // declararlas.
        vec4 clipPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_Position = clipPos;
        vScreenUv = clipPos.xy / clipPos.w * 0.5 + 0.5;
      }
    `;
    const arrowFragmentShader = `
      precision mediump float;
      uniform float uOpacity;
      varying vec2 vScreenUv;
      ${gradingGLSL}
      void main() {
        // Acá NO se espeja vScreenUv (a diferencia del fondo) — llegaba
        // espejado dos veces: una porque toWorld() ya posiciona la malla
        // en el lado correcto de la pantalla (mismo espejo que usan todas
        // las figuras), y otra porque sampleOriginalVideo() espejaba de
        // nuevo — el resultado era que la ventana mostraba el video del
        // lado contrario al que ocupa la flecha en pantalla.
        gl_FragColor = vec4(sampleGradedVideo(vScreenUv), uOpacity);
      }
    `;
    const arrowMaterial = new THREE.ShaderMaterial({
      uniforms: arrowUniforms,
      vertexShader: arrowVertexShader,
      fragmentShader: arrowFragmentShader,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      // Sin esto, Three.js solo dibuja la cara frontal del triángulo (según
      // el orden de sus vértices) — las otras figuras (createDeformableShape)
      // ya usan DoubleSide, a esta se le había quedado afuera. Sin
      // DoubleSide, según el ángulo/orden con el que updateArrowhead arma
      // los puntos, la ventana podía quedar "recortada" (cara trasera,
      // invisible) y se veía el triángulo azul de triShape.mesh por debajo.
      side: THREE.DoubleSide
    });
    const arrowMesh = new THREE.Mesh(triShape.geometry, arrowMaterial);
    arrowMesh.visible = false;
    // triShape.mesh también es transparent:true, así que ambos entran en la
    // cola de objetos transparentes de Three.js (se ordenan por distancia a
    // la cámara por defecto) — como comparten la misma posición, ese orden
    // podría no ser estable. renderOrder alto fuerza que arrowMesh SIEMPRE
    // se dibuje después (encima), sin depender de ese sorteo.
    arrowMesh.renderOrder = 999;
    scene.add(arrowMesh);

    // El renderer ya no puede auto-limpiar entre pasadas (fondo + figuras)
    // o la segunda pasada borraría la primera — se limpia a mano una vez
    // por tick, ver renderBoth() más abajo.
    renderer.autoClear = false;

    function renderBoth() {
      // uVideoSize se actualiza acá (no en cada updateShapeVertices) porque
      // solo cambia si cambia la resolución de cámara — muy poco costo,
      // simplemente evita quedar desalineado si eso llegara a pasar.
      if (videoEl.videoWidth && videoEl.videoHeight) {
        bgUniforms.uVideoSize.value.set(videoEl.videoWidth, videoEl.videoHeight);
      }
      renderer.clear();
      renderer.render(bgScene, bgCamera);
      renderer.clearDepth();
      renderer.render(scene, camera3D);
    }

    // ---- Animación de encendido/apagado (reemplaza la transición CSS) ----
    // Mismo patrón de easing por duración que ya se usa en updatePopAnimation
    // / updateLaunchAnimation, aplicado acá a uMix en vez de a una malla.
    const COLOR_MIX_DURATION_MS = 220;
    let colorMixFrom = 0;
    let colorMixTarget = 0;
    let colorMixAnimStartAt = 0;

    function setColorMixTarget(target, now) {
      colorMixFrom = bgUniforms.uMix.value;
      colorMixTarget = target;
      colorMixAnimStartAt = now;
    }

    function updateColorMixAnimation(now) {
      const t = Math.min(1, (now - colorMixAnimStartAt) / COLOR_MIX_DURATION_MS);
      const eased = t * (2 - t); // ease-out cuadrático, igual que el pop-in
      bgUniforms.uMix.value = colorMixFrom + (colorMixTarget - colorMixFrom) * eased;
    }

    // Al entrar al Acto 2 (ver resetColorEffect), la cámara se desliza
    // sola hacia abajo hasta desaparecer del todo — de ahí en adelante
    // queda negro de fondo, con solo la gema visible. Es de una sola vía
    // (no hay "deslizar de vuelta"): el Acto 2 tampoco tiene vuelta atrás.
    const CAMERA_SLIDE_DURATION_MS = 900;
    let cameraSlideStartAt = null;

    function startCameraSlide(now) { cameraSlideStartAt = now; }

    function updateCameraSlideAnimation(now) {
      if (cameraSlideStartAt === null) return;
      const t = Math.min(1, (now - cameraSlideStartAt) / CAMERA_SLIDE_DURATION_MS);
      const eased = t * (2 - t); // mismo ease-out que el resto de las animaciones
      bgUniforms.uSlideOffset.value = eased;
      if (t >= 1) cameraSlideStartAt = null; // terminó — se queda en 1 (negro)
    }

    // Panel permanente: cada slider mueve su uniform en vivo. uMix
    // deliberadamente NO tiene slider — ya tiene su propio control
    // dedicado (el gesto del arco), exponerlo también acá duplicaría esa
    // interacción de forma confusa.
    document.getElementById('ctrl-intensity').addEventListener('input', (e) => {
      bgUniforms.uEffectIntensity.value = parseFloat(e.target.value);
    });
    document.getElementById('ctrl-contrast').addEventListener('input', (e) => {
      bgUniforms.uContrast.value = parseFloat(e.target.value);
    });
    document.getElementById('ctrl-saturation').addEventListener('input', (e) => {
      bgUniforms.uSaturation.value = parseFloat(e.target.value);
    });
    document.getElementById('ctrl-brightness').addEventListener('input', (e) => {
      bgUniforms.uBrightness.value = parseFloat(e.target.value);
    });
    document.getElementById('ctrl-palette-shift').addEventListener('input', (e) => {
      bgUniforms.uPaletteShift.value = parseFloat(e.target.value);
    });

    // ========== MEDIAPIPE: MANOS + POSE (comparten el mismo runtime WASM) ==========
    // numHands: 2 es un MÁXIMO, no un mínimo — MediaPipe reporta cuántas
    // manos encuentra de verdad (0, 1 o 2) hasta ese tope, así que el mismo
    // detector sirve para las dos figuras sin cambiar nada aquí.
    //
    // PoseLandmarker (variante "lite", la más liviana disponible) es
    // exclusivamente para leer el codo — HandLandmarker no tiene ese dato.
    // Se crea a partir del mismo `vision` (FilesetResolver) que HandLandmarker
    // para no cargar el runtime WASM dos veces.
    async function loadLandmarkers() {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      const handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numHands: 2
      });
      const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numPoses: 1
      });
      return { handLandmarker, poseLandmarker };
    }

    // ========== DETECCIÓN DE PUÑO (espacio libre, sin trackear) ==========
    // Mismo criterio que ya usaba particle_system.html (el proyecto
    // original): comparar qué tan lejos está la punta de cada dedo respecto
    // a la muñeca, contra qué tan lejos está su nudillo medio (PIP) — si la
    // punta está más cerca que el nudillo, el dedo está doblado. No se
    // incluye el pulgar (su anatomía no se comporta igual con esta
    // comparación, sería menos confiable) — con los otros 4 dedos alcanza
    // para una señal robusta.
    function isFist(landmarks) {
      const wrist = landmarks[0];
      const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]]; // [punta, pip] de índice/medio/anular/meñique
      let curled = 0;
      let indexCurled = false;
      for (const [tipIdx, pipIdx] of fingers) {
        const tipDist = Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y);
        const pipDist = Math.hypot(landmarks[pipIdx].x - wrist.x, landmarks[pipIdx].y - wrist.y);
        const isCurled = tipDist < pipDist * 1.05;
        if (isCurled) curled++;
        if (tipIdx === 8) indexCurled = isCurled;
      }
      // El índice tiene que estar doblado SÍ o SÍ para contar como puño — un
      // puño de verdad siempre lo tiene doblado, y esto evita que choque con
      // otros gestos que lo mantienen estirado a propósito (pistola del
      // arco, chasquido): ambos doblan medio/anular/meñique pero dejan el
      // índice afuera, lo que antes bastaba para cruzar el umbral de "3 de
      // 4" y quedaban mal clasificados como puño.
      return indexCurled && curled >= 3;
    }

    // ========== GESTOS: "PISTOLA" Y "PELLIZCO" (para el arco y flecha) ==========
    // Mismo estilo de criterio auto-normalizado que isFist (comparar dos
    // distancias entre sí en vez de usar un número absoluto) — así no
    // importa qué tan cerca o lejos esté la mano de la cámara.
    function handScale(landmarks) {
      // Distancia muñeca (0) -> nudillo medio (9): referencia estable del
      // "tamaño" de la mano en pantalla, para normalizar otras distancias.
      const wrist = landmarks[0], midMcp = landmarks[9];
      return Math.hypot(midMcp.x - wrist.x, midMcp.y - wrist.y) || 1e-6;
    }

    function pinchRatio(landmarks, tipA, tipB) {
      // < ~0.35 = dedos juntos (pellizco/chasquido cerrado), > ~0.6 = bien
      // separados. Sirve tanto para pulgar+índice (tensar el arco) como
      // para pulgar+medio (chasquido) pasando los índices de landmark.
      return Math.hypot(landmarks[tipA].x - landmarks[tipB].x, landmarks[tipA].y - landmarks[tipB].y) / handScale(landmarks);
    }
    const PINCH_CLOSED_RATIO = 0.35; // dedos juntos = pellizco cerrado
    const PINCH_OPEN_RATIO = 0.6;    // ...separados = abierto (zona muerta entre ambos, evita parpadeo)

    function isGunHand(landmarks) {
      // Índice extendido (como el cañón) + medio/anular/meñique doblados
      // (mismo criterio de isFist) + pulgar CLARAMENTE separado de la punta
      // del índice.
      //
      // Ese último punto es el que faltaba y causaba que se confundieran
      // las manos: un pellizco natural (pulgar+índice juntos) también suele
      // doblar un poco el resto de los dedos, así que sin esta condición la
      // mano del pellizco podía calificar como "pistola" igual que la mano
      // que de verdad hace el gesto — cuál ganaba dependía del orden en que
      // MediaPipe las reportaba, no de la intención real. La separación
      // pulgar-índice es lo que de verdad distingue las dos poses: en la
      // pistola el pulgar apunta lejos del índice (arriba), en el pellizco
      // están juntos por definición.
      const wrist = landmarks[0];
      const curledFingers = [[12, 10], [16, 14], [20, 18]]; // medio/anular/meñique
      let curled = 0;
      for (const [tipIdx, pipIdx] of curledFingers) {
        const tipDist = Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y);
        const pipDist = Math.hypot(landmarks[pipIdx].x - wrist.x, landmarks[pipIdx].y - wrist.y);
        if (tipDist < pipDist * 1.05) curled++;
      }
      const indexTip = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y);
      const indexPip = Math.hypot(landmarks[6].x - wrist.x, landmarks[6].y - wrist.y);
      const indexExtended = indexTip > indexPip * 1.15;
      const notPinching = pinchRatio(landmarks, 4, 8) > PINCH_OPEN_RATIO;
      return curled >= 2 && indexExtended && notPinching;
    }

    // ========== LANDMARKS -> VÉRTICES ==========
    // Cuadrilátero: pulgar (4) + índice (8) de cada mano, asignadas a
    // "izquierda"/"derecha" de la PANTALLA comparando su posición X en cada
    // frame (no por la etiqueta Left/Right que da MediaPipe) — así el lado
    // izquierdo de la malla siempre corresponde a la mano que está
    // visualmente a la izquierda, sin saltos raros si se cruzan.
    //
    // Triángulo: muñeca (0) + índice (8) + meñique (20) de la única mano
    // detectada. Primer intento fue pulgar+índice+medio (extensión directa
    // del patrón del cuadrilátero), pero en vivo se veía como una astilla
    // delgada en vez de un triángulo — esas tres puntas quedan muy cerca
    // entre sí en cuanto la mano no está muy abierta, casi degenerando la
    // forma a una línea. La muñeca es un punto que casi no se mueve con el
    // gesto de los dedos (ancla estable), e índice/meñique son los dos dedos
    // más separados de la mano — da un triángulo grande y robusto incluso
    // con la mano relajada.
    //
    // El "zoom" no necesita cálculo aparte en ninguna de las dos: al acercar
    // la(s) mano(s) a la cámara, los puntos se separan más entre sí en el
    // espacio de imagen (perspectiva), así que la figura crece sola.
    //
    // Mapeo landmark -> mundo 3D en dos pasos (ver PLAN.md para el porqué):
    //  1) `getCoverCrop()`: qué porción del frame de la cámara es la que
    //     realmente se ve en pantalla (el video usa `object-fit: cover`).
    //  2) `getVisibleFrustum()`: tamaño real visible (unidades de mundo) a la
    //     profundidad de la malla, calculado del FOV — no un número inventado.
    function getCoverCrop() {
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      const cw = window.innerWidth, ch = window.innerHeight;
      if (!vw || !vh) return { sx: 0, sy: 0, sw: cw, sh: ch, vw: cw, vh: ch };
      const videoAspect = vw / vh;
      const containerAspect = cw / ch;
      let sx, sy, sw, sh;
      if (videoAspect > containerAspect) {
        sh = vh; sw = vh * containerAspect; sx = (vw - sw) / 2; sy = 0;
      } else {
        sw = vw; sh = vw / containerAspect; sx = 0; sy = (vh - sh) / 2;
      }
      return { sx, sy, sw, sh, vw, vh };
    }

    function getVisibleFrustum() {
      const distance = camera3D.position.z; // las mallas viven en z=0
      const vFov = THREE.MathUtils.degToRad(camera3D.fov);
      const height = 2 * Math.tan(vFov / 2) * distance;
      const width = height * camera3D.aspect;
      return { width, height };
    }

    function toWorld(landmark, crop, frustum) {
      // Posición del landmark dentro del frame CRUDO de la cámara -> dentro
      // de la porción que realmente se ve en pantalla (0..1) -> mundo 3D.
      // Espejado en X: el video se muestra en espejo (CSS) pero MediaPipe
      // analiza el frame sin espejar.
      const px = landmark.x * crop.vw;
      const py = landmark.y * crop.vh;
      const dispX = (px - crop.sx) / crop.sw;
      const dispY = (py - crop.sy) / crop.sh;
      return {
        x: (0.5 - dispX) * frustum.width,
        y: -(dispY - 0.5) * frustum.height
      };
    }

    function makeCornerFilters(count) {
      return Array.from({ length: count }, () => ({
        x: new OneEuroFilter(30, POS_MINCUTOFF, POS_BETA),
        y: new OneEuroFilter(30, POS_MINCUTOFF, POS_BETA)
      }));
    }
    const quadFilters = makeCornerFilters(4);
    const triFilters = makeCornerFilters(3);
    // Filtros propios para la flecha del arco (no se comparten con
    // triFilters): aunque ambas usan triShape, vienen de landmarks
    // distintos (muñeca+índice+meñique vs. muñeca+pulgar+índice). Si
    // compartieran filtro, cambiar de fuente de golpe al entrar/salir del
    // modo arco haría que el 1 Euro Filter viera un "salto" brusco en la
    // posición cruda y overshoot-eara tratando de suavizarlo.
    const arrowFilters = makeCornerFilters(3);
    // La gema ya NO lee landmarks individuales de dedo — solo 2 muñecas
    // (posición) y 2 números de "apertura" (uno por mano, ver
    // handOpenness() más abajo), cada uno con su propio filtro.
    const gemWristFilters = makeCornerFilters(2); // x,y — muñeca izquierda y derecha
    const gemOpennessFilters = [
      new OneEuroFilter(30, POS_MINCUTOFF, POS_BETA),
      new OneEuroFilter(30, POS_MINCUTOFF, POS_BETA)
    ];

    function updateShapeVertices(shape, filters, points, timestamp, { stampable = true } = {}) {
      const crop = getCoverCrop();
      const frustum = getVisibleFrustum();
      const posAttr = shape.geometry.attributes.position;
      for (let i = 0; i < points.length; i++) {
        const w = toWorld(points[i], crop, frustum);
        const sx = filters[i].x.filter(w.x, timestamp);
        const sy = filters[i].y.filter(w.y, timestamp);
        posAttr.setXYZ(i, sx, sy, 0);
      }
      posAttr.needsUpdate = true;
      // La malla se deforma cada frame — hay que recalcular las normales
      // para que el sombreado de MeshNormalMaterial siga siendo correcto.
      shape.geometry.computeVertexNormals();
      // El fijado por quietud (checkStillness) es del mecanismo de
      // cuadrilátero/triángulo "decorativo" — la flecha del arco tiene su
      // propio mecanismo de "soltar" (el disparo), y necesita sostener la
      // mano pistola quieta mientras se tensa con la otra mano, que es
      // justo la condición que dispararía un fijado no deseado. Por eso
      // updateArrowhead llama con stampable:false.
      if (stampable) checkStillness(shape, timestamp);
    }

    // ========== GEMA (Acto 2 — dos manos abiertas) ==========
    // A diferencia de las demás figuras (planos con Z=0), la gema tiene
    // volumen real — pero a diferencia de los intentos anteriores (ver
    // comentario junto a buildGemGeometry), ese volumen sale de señales
    // AGREGADAS y estables, no de landmarks individuales de dedo.

    // "Apertura" de una mano: un solo número — el promedio de qué tan
    // lejos están las puntas de los 4 dedos largos (sin pulgar, igual que
    // isFist) respecto a la muñeca, normalizado por handScale() (mismo
    // truco de auto-normalización que ya usan pinchRatio/el arco, así no
    // importa qué tan lejos esté la mano de la cámara). Puño cerrado da un
    // número chico, mano bien abierta uno grande — es un solo escalar
    // filtrado, no 4 puntos temblando cada uno por su cuenta.
    const GEM_OPENNESS_LANDMARKS = [8, 12, 16, 20]; // puntas índice/medio/anular/meñique
    function handOpenness(landmarks) {
      const scale = handScale(landmarks);
      let sum = 0;
      for (const li of GEM_OPENNESS_LANDMARKS) {
        sum += Math.hypot(landmarks[li].x - landmarks[0].x, landmarks[li].y - landmarks[0].y);
      }
      return (sum / GEM_OPENNESS_LANDMARKS.length) / scale;
    }
    // Rango de calibración de handOpenness() — valores de partida, por
    // ajustar en vivo (mismo criterio que PINCH_CLOSED/OPEN_RATIO).
    const GEM_OPENNESS_MIN = 1.4; // puño cerrado, aprox.
    const GEM_OPENNESS_MAX = 3.2; // mano bien abierta, aprox.
    const GEM_RADIUS_MIN = 0.35;  // radio del anillo (mundo) con la mano cerrada
    const GEM_RADIUS_MAX = 1.15;  // ...con la mano bien abierta
    function opennessToRadius(openness) {
      const t = THREE.MathUtils.clamp((openness - GEM_OPENNESS_MIN) / (GEM_OPENNESS_MAX - GEM_OPENNESS_MIN), 0, 1);
      return GEM_RADIUS_MIN + t * (GEM_RADIUS_MAX - GEM_RADIUS_MIN);
    }

    // Qué tan lejos sobresale la punta chica de cada anillo, relativo al
    // propio radio de ESE anillo (no un tamaño fijo de mundo — así se ve
    // bien tanto con la mano cerrada como abierta).
    const GEM_TAPER_RATIO = 0.9;
    // Separación máxima entre los dos anillos, en "radios promedio" —
    // mismo problema ya encontrado en el intento anterior: con las manos
    // separadas (lo natural al mostrar "dos manos abiertas") la gema
    // puede quedar como un cuchillo larguísimo si no se limita la
    // proporción largo/ancho. La dirección real siempre se respeta, solo
    // se acorta la distancia.
    const GEM_MAX_LENGTH_RATIO = 3.5;

    // ---- Movimientos con "comando" (contar dedos) ----
    // Tres animaciones sobre la gema ya armada arriba, disparadas por un
    // comando explícito y discreto — se probaron gestos de movimiento
    // (girar rápido, abrir/cerrar rápido, subir rápido) y no se sentían
    // bien ni eran confiables de repetir a propósito. Reemplazado por algo
    // mucho más simple: levantar UNA mano mostrando 1, 2 o 3 dedos — igual
    // de fácil de leer para MediaPipe que el resto de las poses del
    // proyecto (mismo criterio punta-vs-nudillo que ya usa isFist, pero
    // contado por dedo en vez de agregado en un sí/no).

    // Cuenta cuántos de los 4 dedos largos (sin pulgar, mismo criterio de
    // exclusión que isFist) están extendidos: punta más lejos de la
    // muñeca que su nudillo medio (PIP).
    const GEM_COMMAND_FINGERS = [
      { tip: 8, pip: 6 },   // índice
      { tip: 12, pip: 10 }, // medio
      { tip: 16, pip: 14 }, // anular
      { tip: 20, pip: 18 }  // meñique
    ];
    function countExtendedFingers(landmarks) {
      const wrist = landmarks[0];
      let count = 0;
      for (const f of GEM_COMMAND_FINGERS) {
        const tipDist = Math.hypot(landmarks[f.tip].x - wrist.x, landmarks[f.tip].y - wrist.y);
        const pipDist = Math.hypot(landmarks[f.pip].x - wrist.x, landmarks[f.pip].y - wrist.y);
        if (tipDist > pipDist) count++;
      }
      return count;
    }
    // Cuánto sostener el conteo (1/2/3) antes de confirmar el comando —
    // evita disparar por un solo frame mal leído al pasar de un número a
    // otro. Después de disparar, un enfriamiento evita repetir el mismo
    // comando muchas veces solo por seguir sosteniendo la mano.
    const GEM_COMMAND_HOLD_MS = 350;
    const GEM_COMMAND_COOLDOWN_MS = 700;
    const GEM_COMMAND_SPIN_KICK = 14; // impulso de giro (rad/s) que da el comando de 1 dedo
    let gemCommandCandidate = null;
    let gemCommandCandidateSince = 0;
    let gemCommandCooldownUntil = 0;

    function fireGemCommand(n, now) {
      if (n === 1) {
        gemSpinVelocity = THREE.MathUtils.clamp(gemSpinVelocity + GEM_COMMAND_SPIN_KICK, -GEM_SPIN_MAX_VELOCITY, GEM_SPIN_MAX_VELOCITY);
      } else if (n === 2) {
        triggerGemPulse(now);
      } else if (n === 3) {
        triggerGemJump(now);
      }
    }

    // Si cualquiera de las dos manos sostiene 1, 2 o 3 dedos el tiempo
    // suficiente, dispara ese comando (con enfriamiento después).
    function checkGemCommands(handLeft, handRight, now) {
      if (now < gemCommandCooldownUntil) return;
      const countLeft = countExtendedFingers(handLeft);
      const countRight = countExtendedFingers(handRight);
      let candidate = null;
      if (countLeft >= 1 && countLeft <= 3) candidate = countLeft;
      else if (countRight >= 1 && countRight <= 3) candidate = countRight;

      if (candidate !== gemCommandCandidate) {
        gemCommandCandidate = candidate;
        gemCommandCandidateSince = now;
        return;
      }
      if (candidate !== null && now - gemCommandCandidateSince >= GEM_COMMAND_HOLD_MS) {
        fireGemCommand(candidate, now);
        gemCommandCooldownUntil = now + GEM_COMMAND_COOLDOWN_MS;
        gemCommandCandidate = null;
      }
    }

    // Giro: decae solo con fricción una vez que algo le dio impulso (ver
    // fireGemCommand) — como un trompo. GEM_SPIN_MAX_VELOCITY topa
    // impulsos repetidos para que no se vuelva absurdo.
    const GEM_SPIN_MAX_VELOCITY = 30;
    const GEM_SPIN_FRICTION = 0.98; // decae multiplicándose por esto cada ~frame — <1, se va frenando solo
    let gemSpinPhase = 0;
    let gemSpinVelocity = 0;
    let gemLastUpdateAt = null;

    // Latido: un pulso de tamaño que sube y vuelve a bajar solo.
    const GEM_PULSE_DURATION_MS = 400;
    const GEM_PULSE_PEAK = 0.4; // +40% de radio en el punto más alto
    let gemPulseStartAt = null;

    // Salto: sube y cae solo, una vez.
    const GEM_JUMP_HEIGHT = 1.2;
    const GEM_JUMP_DURATION_MS = 500;
    let gemJumpStartAt = null;

    function triggerGemPulse(now) { gemPulseStartAt = now; }
    function triggerGemJump(now) { gemJumpStartAt = now; }

    // Se llama al ocultar la gema (ver hideShape) — sin esto, al
    // reaparecer heredaría un dt gigante (todo el tiempo que estuvo
    // oculta) y lo leería como un giro brusco que nunca pasó.
    function resetGemMotionState() {
      gemSpinVelocity = 0;
      gemLastUpdateAt = null;
      gemPulseStartAt = null;
      gemJumpStartAt = null;
      gemCommandCandidate = null;
      gemCommandCandidateSince = 0;
      gemCommandCooldownUntil = 0;
    }

    function gemPulseFactor(now) {
      if (gemPulseStartAt === null) return 1;
      const t = (now - gemPulseStartAt) / GEM_PULSE_DURATION_MS;
      if (t >= 1) { gemPulseStartAt = null; return 1; }
      return 1 + GEM_PULSE_PEAK * Math.sin(Math.PI * t); // sube y baja, un solo pulso
    }
    function gemJumpOffset(now) {
      if (gemJumpStartAt === null) return 0;
      const t = (now - gemJumpStartAt) / GEM_JUMP_DURATION_MS;
      if (t >= 1) { gemJumpStartAt = null; return 0; }
      return GEM_JUMP_HEIGHT * Math.sin(Math.PI * t); // sube y vuelve a bajar, un solo salto
    }

    // handLeft/handRight ya vienen ordenadas por posición X (ver
    // processActTwo, mismo criterio estable que ya usa el cuadrilátero) —
    // cada mano molda su propio extremo, ningún rol especial para
    // ninguna de las dos.
    function updateGem(handLeft, handRight, timestamp) {
      const crop = getCoverCrop();
      const frustum = getVisibleFrustum();

      const wLeft = toWorld(handLeft[0], crop, frustum);
      const wRight = toWorld(handRight[0], crop, frustum);
      const lx = gemWristFilters[0].x.filter(wLeft.x, timestamp);
      const ly = gemWristFilters[0].y.filter(wLeft.y, timestamp);
      const rx = gemWristFilters[1].x.filter(wRight.x, timestamp);
      const ry = gemWristFilters[1].y.filter(wRight.y, timestamp);

      const openLeft = gemOpennessFilters[0].filter(handOpenness(handLeft), timestamp);
      const openRight = gemOpennessFilters[1].filter(handOpenness(handRight), timestamp);
      let radiusLeft = opennessToRadius(openLeft);
      let radiusRight = opennessToRadius(openRight);

      const left = new THREE.Vector3(lx, ly, 0);
      const right = new THREE.Vector3(rx, ry, 0);
      const spine = right.clone().sub(left);
      const rawDist = spine.length();
      if (rawDist < 1e-4) return; // manos coincidiendo — evita NaN más abajo
      spine.normalize();

      // dt general de este tramo, para la fricción del giro —
      // `gemLastUpdateAt` se resetea al ocultarse la gema (ver hideShape)
      // así que no arrastra un dt gigante de cuando estuvo oculta.
      const dt = gemLastUpdateAt !== null ? (timestamp - gemLastUpdateAt) / 1000 : 0;
      gemLastUpdateAt = timestamp;

      // Comando por dedos (1/2/3) — ver checkGemCommands/fireGemCommand.
      checkGemCommands(handLeft, handRight, timestamp);

      if (dt > 0) {
        gemSpinPhase += gemSpinVelocity * dt;
        gemSpinVelocity *= GEM_SPIN_FRICTION;
      }
      const pulseFactor = gemPulseFactor(timestamp);
      radiusLeft *= pulseFactor;
      radiusRight *= pulseFactor;

      const avgRadius = (radiusLeft + radiusRight) / 2;
      const maxDist = avgRadius * GEM_MAX_LENGTH_RATIO;
      const dist = Math.min(rawDist, maxDist);
      const mid = left.clone().add(right).multiplyScalar(0.5);
      mid.y += gemJumpOffset(timestamp);

      const half = spine.clone().multiplyScalar(dist / 2);
      const centerLeft = mid.clone().sub(half);
      const centerRight = mid.clone().add(half);

      // Mismo marco angular (perpRight/perpDepth) para los dos anillos —
      // así quedan alineados vértice a vértice y la cintura no se tuerce.
      // gemSpinPhase se suma acá: es lo que hace que el anillo "gire
      // sobre su propio eje" en vez de solo trasladarse.
      const perpRight = new THREE.Vector3(-spine.y, spine.x, 0).normalize();
      const perpDepth = new THREE.Vector3(0, 0, 1);

      const posAttr = gemShape.geometry.attributes.position;
      const sides = GEM_RING_SIDES;
      const writeRing = (baseIndex, center, radius) => {
        for (let i = 0; i < sides; i++) {
          const theta = (2 * Math.PI * i) / sides + gemSpinPhase;
          const p = center.clone()
            .addScaledVector(perpRight, Math.cos(theta) * radius)
            .addScaledVector(perpDepth, Math.sin(theta) * radius);
          posAttr.setXYZ(baseIndex + i, p.x, p.y, p.z);
        }
      };
      writeRing(1, centerLeft, radiusLeft);
      writeRing(1 + sides, centerRight, radiusRight);

      const apexLeft = centerLeft.clone().addScaledVector(spine, -radiusLeft * GEM_TAPER_RATIO);
      const apexRight = centerRight.clone().addScaledVector(spine, radiusRight * GEM_TAPER_RATIO);
      posAttr.setXYZ(0, apexLeft.x, apexLeft.y, apexLeft.z);
      posAttr.setXYZ(1 + 2 * sides, apexRight.x, apexRight.y, apexRight.z);

      posAttr.needsUpdate = true;
      gemShape.geometry.computeVertexNormals();
      // A propósito NO llama a checkStillness: la gema no se fija nunca,
      // ni por quietud ni de ninguna otra forma — el Acto 2 es solo la
      // figura viva siguiendo las manos, sin el mecanismo de "copias
      // congeladas" del Acto 1.
    }

    // ========== FIGURAS FIJADAS (quedan en pantalla) ==========
    // No se fijan al soltar la mano — se fijan si la figura se queda
    // QUIETA en más o menos el mismo lugar un rato corto. "Quieta" tolera un
    // radio pequeño, no un punto exacto: con un punto exacto, el temblor
    // natural de la mano (por más suavizado que ya tenga) nunca cumpliría la
    // condición. La figura viva sigue funcionando normal después de fijar
    // una copia — puede volver a fijar otra si se queda quieta en otro lugar.
    const STILL_TOLERANCE = 0.45;   // unidades de mundo — radio de tolerancia
    const STILL_DURATION_MS = 600;  // "no tiene que ser mucho"
    const MAX_STAMPED_SHAPES = 5;
    const stampedShapes = [];

    // Al arrancar (o justo después de un borrado completo) hay un ratito de
    // "calentamiento" sin poder fijar nada — fiel al video de referencia,
    // que empieza jugando con la figura antes de dejar la primera. A
    // diferencia del sistema de fases (que se sacó por sentirse demasiado
    // restrictivo), esto NO bloquea qué figuras se reconocen — cuadrilátero,
    // triángulo y arco siguen disponibles todo el tiempo — solo retrasa el
    // FIJADO un momento al principio de cada ronda.
    const STAMPING_LOCKED_MS = 4000;
    let sessionStartAt = performance.now();

    function shapeCentroid(shape) {
      const posAttr = shape.geometry.attributes.position;
      const c = new THREE.Vector3();
      const v = new THREE.Vector3();
      for (let i = 0; i < posAttr.count; i++) c.add(v.fromBufferAttribute(posAttr, i));
      return c.divideScalar(posAttr.count);
    }

    function stampShape(shape) {
      // Copia independiente (geometry/material clonados) con la forma
      // deformada exacta que tenía en el momento de fijarse — no una
      // referencia a la malla viva, si no cambiaría junto con ella después.
      const geometry = shape.geometry.clone();
      const material = shape.material.clone();
      material.opacity = 1;      // ya estaba totalmente visible: esto es un
      material.transparent = false; // congelamiento instantáneo, no una aparición nueva
      // (la escala queda en (1,1,1), el default de un Mesh recién creado —
      // no hereda la escala de pop-in de la malla viva, que es lo que
      // importa: el tamaño final no depende de en qué punto del pop-in
      // estaba cuando se fijó)
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      stampedShapes.push(mesh);

      if (stampedShapes.length > MAX_STAMPED_SHAPES) {
        const old = stampedShapes.shift();
        scene.remove(old);
        old.geometry.dispose();
        old.material.dispose();
      }
    }

    function checkStillness(shape, now) {
      const center = shapeCentroid(shape);
      if (!shape.stillCenter || center.distanceTo(shape.stillCenter) > STILL_TOLERANCE) {
        // Se movió más que la tolerancia (o es la primera medición): arranca
        // de nuevo el reloj de quietud en la posición actual.
        shape.stillCenter = center;
        shape.stillSince = now;
        shape.hasStamped = false;
        return;
      }
      if (
        !shape.hasStamped &&
        now - shape.stillSince >= STILL_DURATION_MS &&
        now - sessionStartAt >= STAMPING_LOCKED_MS // todavía en el "calentamiento" inicial — ver declaración
      ) {
        stampShape(shape);
        shape.hasStamped = true; // no fijar de nuevo en el mismo sitio hasta que se mueva
      }
    }

    // ========== GESTO DE BORRADO: PUÑO + CODO VISIBLE ==========
    // Combina dos señales que ya existen en el proyecto en vez de inventar
    // una tercera detección: el PUÑO (isFist, ya usado para "espacio libre")
    // y el CODO visible (PoseLandmarker, landmarks 13/14 = codo
    // izquierdo/derecho — HandLandmarker no ve más allá de la muñeca).
    //
    // Se descartaron dos alternativas: un "swipe" de mano (no se sentía
    // claro ni confiable) y codo-solo por proximidad/movimiento (obligaba a
    // enseñar la palma abierta para que el codo quedara bien visible, lo que
    // disparaba el modo triángulo de fondo justo mientras se intentaba
    // borrar — molesto). Con el puño no hay ese choque: un puño ya hace que
    // `usableHands` lo filtre, así que no aparece ninguna figura mientras se
    // hace el gesto.
    //
    // `elbowVisible` y `anyHandIsFist` se actualizan cada uno a su propia
    // frecuencia (el codo mucho menos seguido, ver POSE_DETECT_EVERY_N) pero
    // el chequeo combinado corre en CADA frame usando el último valor
    // conocido de cada uno — así no hace falta que las dos detecciones
    // coincidan en el mismo tick exacto.
    //
    // Se exige sostener ambas condiciones un momento corto
    // (ELBOW_CLEAR_HOLD_MS) antes de borrar: un puño rápido con el codo de
    // paso en cuadro (por ejemplo, solo reacomodando la postura) no debería
    // disparar el borrado sin querer — tiene que ser un gesto sostenido, no
    // instantáneo.
    const ELBOW_MIN_VISIBILITY = 0.5; // ignora landmarks de baja confianza del codo
    const ELBOW_CLEAR_HOLD_MS = 600;  // cuánto hay que sostener puño+codo
    const ELBOW_CLEAR_COOLDOWN_MS = 1200;
    let elbowVisible = false;
    let anyHandIsFist = false;
    let elbowClearHeldSince = null;
    let lastElbowClearAt = -Infinity;

    function isElbowVisible(poseLandmarksList) {
      if (!poseLandmarksList || poseLandmarksList.length === 0) return false;
      const lm = poseLandmarksList[0]; // numPoses: 1 -> a lo sumo una persona
      return [lm[13], lm[14]].some(
        (p) => p && (p.visibility === undefined || p.visibility >= ELBOW_MIN_VISIBILITY)
      );
    }

    function clearAllStamped() {
      for (const mesh of stampedShapes) {
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
      }
      stampedShapes.length = 0;
      // Cada borrado da un nuevo "calentamiento" antes de poder volver a
      // fijar algo — ver STAMPING_LOCKED_MS.
      sessionStartAt = performance.now();
      // Confirmación clara del momento exacto del borrado (antes no había
      // ninguna señal de "esto fue lo que lo disparó") — vuelve al contador
      // normal después de un momento.
      stampedStatusEl.textContent = '¡BORRADO!';
      stampedStatusEl.classList.add('ok');
      setTimeout(() => {
        stampedStatusEl.textContent = 'Fijadas: 0/' + MAX_STAMPED_SHAPES;
        stampedStatusEl.classList.remove('ok');
      }, 900);
    }

    function checkElbowClearGesture(now) {
      setElbowStatus(elbowVisible ? 'listo' : 'fuera de cuadro', elbowVisible ? 'ok' : 'bad');

      const active = elbowVisible && anyHandIsFist;
      if (!active) {
        elbowClearHeldSince = null;
        return;
      }
      if (elbowClearHeldSince === null) {
        elbowClearHeldSince = now;
        return;
      }
      if (
        now - elbowClearHeldSince >= ELBOW_CLEAR_HOLD_MS &&
        now - lastElbowClearAt >= ELBOW_CLEAR_COOLDOWN_MS &&
        stampedShapes.length > 0
      ) {
        clearAllStamped();
        lastElbowClearAt = now;
        elbowClearHeldSince = null;
      }
    }

    function updateQuad(leftHandLm, rightHandLm, timestamp) {
      updateShapeVertices(quadShape, quadFilters, [
        leftHandLm[8], rightHandLm[8],  // índice izq, índice der (arriba)
        leftHandLm[4], rightHandLm[4]   // pulgar izq, pulgar der (abajo)
      ], timestamp);
    }

    function isFormingGunHand(landmarks) {
      // Señal más laxa que isGunHand: solo pide índice extendido + AL MENOS
      // uno de medio/anular/meñique doblado (isGunHand pide 2+, y además
      // pulgar separado). Una mano abierta normal (los 5 dedos extendidos)
      // no cumple esto, así que no afecta el fijado del triángulo en el
      // caso común. Cubre la ventana de tiempo en la que alguien está
      // formando la pose de pistola a mano (el índice ya salió, el resto
      // todavía se está doblando) — sin esto, si la muñeca se queda
      // relativamente quieta mientras solo los dedos terminan de acomodarse
      // (lo natural al armar la pistola), el triángulo normal alcanza a
      // fijar una copia no deseada antes de que isGunHand la reconozca del
      // todo y el modo arco tome el control.
      const wrist = landmarks[0];
      const indexTip = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y);
      const indexPip = Math.hypot(landmarks[6].x - wrist.x, landmarks[6].y - wrist.y);
      if (indexTip <= indexPip * 1.15) return false;

      const otherFingers = [[12, 10], [16, 14], [20, 18]];
      return otherFingers.some(([tipIdx, pipIdx]) => {
        const tipDist = Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y);
        const pipDist = Math.hypot(landmarks[pipIdx].x - wrist.x, landmarks[pipIdx].y - wrist.y);
        return tipDist < pipDist * 1.05;
      });
    }

    function updateTriangle(handLm, timestamp) {
      // Solo se llama en fase 2+ (ver processHandDetection) — el paso de
      // fase 1 a 2 ya pasó antes de llegar acá, así que no hace falta
      // ninguna lógica de desbloqueo en esta función.
      // stampable:false mientras la mano parece estar formando una pistola
      // (ver isFormingGunHand) — no se quiere fijar el triángulo genérico a
      // mitad de ese gesto.
      updateShapeVertices(triShape, triFilters, [
        handLm[0], handLm[8], handLm[20]  // muñeca, índice, meñique
      ], timestamp, { stampable: !isFormingGunHand(handLm) });
    }

    // ========== TRANSICIÓN ENTRE FIGURAS ==========
    // No es un morph geométrico entre cuadrilátero y triángulo — no tendría
    // sentido físico, porque el cambio de 1 a 2 manos es discreto (una
    // persona no "interpola" entre mostrar una mano y dos). En vez de eso: la
    // figura que aparece entra con un pop-in corto (escala + opacidad), la
    // que desaparece se oculta directo. Se ve intencional, no es un corte
    // seco, y no exige resolver una correspondencia de vértices sin sentido.
    const POP_DURATION_MS = 220;

    function showShape(shape, now) {
      if (!shape.mesh.visible) {
        shape.mesh.visible = true;
        shape.appearAt = now;
      }
    }
    function hideShape(shape) {
      shape.mesh.visible = false;
      shape.mesh.position.set(0, 0, 0); // por si quedó desplazada de una animación de disparo (ver ARCO Y FLECHA)
      shape.material.opacity = 0;
      // Se resetea el reloj de quietud: al reaparecer puede estar en
      // cualquier otro lugar, no debe arrastrar la posición/tiempo viejos.
      shape.stillCenter = null;
      // La "ventana" del arco (ver ARCO Y FLECHA) tapa a triShape.mesh
      // mientras está activa — al ocultar triShape, se apaga junto con él.
      if (shape === triShape) arrowMesh.visible = false;
      // Ver comentario en resetGemMotionState().
      if (shape === gemShape) resetGemMotionState();
    }
    function updatePopAnimation(shape, now) {
      if (!shape.mesh.visible) return;
      const t = Math.min(1, (now - shape.appearAt) / POP_DURATION_MS);
      const eased = t * (2 - t); // ease-out cuadrático
      shape.mesh.scale.setScalar(0.6 + 0.4 * eased);
      shape.material.opacity = eased;
    }

    // ========== ARCO Y FLECHA ==========
    // Primer intento: reevaluar "¿hay pistola + pellizco AHORA MISMO?" cada
    // frame, como una clasificación más del mismo tipo que cuadrilátero/
    // triángulo. No se sintió bien en la prueba — exigir que las DOS manos
    // den justo en el blanco en el mismo frame exacto es fragil, y cualquier
    // parpadeo de tracking te saca del modo. Rediseñado como una máquina de
    // dos fases con un gesto de entrada explícito, para que no tenga que
    // competir cuadro a cuadro con cuadrilátero/triángulo/puño:
    //
    //   idle  --(pistola sostenida BOW_ARM_HOLD_MS)-->  armed
    //   armed --(se pierde la pistola BOW_EXIT_HOLD_MS)--> idle  (se cancela sin disparar)
    //   armed --(pellizco tensado y soltado)--> dispara --> idle
    //
    // Una vez "armed", el sistema DEJA de evaluar cuadrilátero/triángulo/
    // puño por completo — solo mira la mano pistola (para la posición del
    // triángulo) y la otra mano (para el pellizco). Si la pistola
    // desaparece un instante (parpadeo normal de tracking) no se sale
    // inmediatamente: se tolera hasta BOW_EXIT_HOLD_MS antes de cancelar.
    //
    // El chasquido (pulgar+medio, mismo patrón de apertura rápida) revierte
    // el color de pantalla completa que activa el disparo.
    //
    // Los umbrales (PINCH_*, MIN_DRAW_RATIO, SNAP_CLOSED_RATIO, los tiempos
    // de armado) son un primer intento razonable, no medidos con datos
    // reales — a diferencia de otras constantes de este archivo
    // (STILL_TOLERANCE, DETECT_EVERY_N) que sí se calibraron en vivo. Hay un
    // debug temporal en pantalla (#bow-debug) para leer valores reales
    // mientras se prueba y ajustar con datos, no a ciegas.
    // PINCH_CLOSED_RATIO / PINCH_OPEN_RATIO viven arriba, junto a
    // pinchRatio() — se reutilizan tal cual (isGunHand también las usa,
    // para descartar que una mano pellizcando cuente como pistola).
    const BOW_ARM_HOLD_MS = 350;     // cuánto sostener la pose de pistola para "armar" el arco
    const BOW_EXIT_HOLD_MS = 700;    // cuánto tiempo SIN pistola para desarmar sin disparar
    const MIN_DRAW_RATIO = 1.4;      // qué tan lejos debe estar la mano del pellizco de la mano pistola para contar como "tensado"
    const LAUNCH_DURATION_MS = 350;  // duración de la animación de disparo
    const SNAP_CLOSED_RATIO = 0.35;  // pulgar+medio juntos = a punto de chasquear
    // Al soltar el pellizco para disparar, la mano se relaja de golpe — eso
    // puede acercar el pulgar al medio sin querer (la misma seña del
    // chasquido) y reabrir el bloqueo casi de inmediato, sin que se haga el
    // gesto de verdad. Se ignora el chasquido este ratito después de cada
    // disparo, dándole tiempo a la mano de asentarse antes de empezar a
    // escuchar un chasquido deliberado.
    const SNAP_IGNORE_MS = 600;

    let bowState = 'idle'; // 'idle' | 'armed'
    let gunHandHoldStartedAt = null;
    let gunHandLostAt = null;
    let bowPinchWasClosed = false;
    let triLaunchStartAt = null;
    let colorEffectActive = false;
    let colorEffectActivatedAt = 0;
    let snapPinchWasClosed = false;
    // El chasquido que revierte el efecto de color es, a propósito, el
    // final del ACTO 1: una vez pasa, el programa "olvida" cuadrilátero/
    // triángulo/arco/pausa por completo y pasa al ACTO 2 (ver esa sección
    // más abajo) — de ahí en adelante solo se reconoce un gesto nuevo, dos
    // manos abiertas, que arma la gema. Ver resetColorEffect() y el
    // chequeo al inicio de processHandDetection.
    let actTwoActive = false;
    let lastPinchRatio = null; // solo para #bow-debug — se arma UNA vez por tick en el loop, no acá
    let lastDrawRatio = null;

    // Posición (muñeca) de la última mano identificada como "pistola" — ver
    // pickGunHand() más abajo. Null significa "no hay identidad establecida
    // todavía, hay que reclasificar por pose".
    let gunHandRefPos = null;
    const GUN_HAND_MATCH_MAX_DIST = 0.3; // qué tan lejos puede estar y seguir contando como "la misma mano"

    // Empieza abierto (arco disponible desde el arranque); resetColorEffect()
    // lo cierra tras cada chasquido — ver comentario ahí y en el loop.
    let bowGateOpen = true;

    // Resetea TODO el estado del ciclo de armado de una sola vez. Se
    // centraliza a propósito: cada punto de salida (disparar, perder la
    // pistola) tenía que acordarse por su cuenta de resetear la combinación
    // correcta de variables, y más de una vez se olvidó alguna durante el
    // desarrollo (el bug de "se queda armado para siempre" fue justo eso —
    // launchTriangle nunca volvía bowState a 'idle'). Con esto, agregar un
    // campo de estado nuevo en el futuro es tocar un solo lugar.
    //
    // bowGateOpen NO se toca acá a propósito — sigue un ciclo de vida
    // distinto (lo cierra resetColorEffect() tras un chasquido, lo abre
    // soltar la pose de pistola), independiente de si se está armando o no.
    function resetBowCycle() {
      bowState = 'idle';
      gunHandHoldStartedAt = null;
      gunHandLostAt = null;
      gunHandRefPos = null;
      bowPinchWasClosed = false;
      lastPinchRatio = null;
      lastDrawRatio = null;
    }

    function pickGunHand(allHands) {
      if (allHands.length === 0) return null;

      if (bowState !== 'armed') {
        // Todavía sin confirmar (armando, o recién reiniciado): hay que
        // exigir que la pose siga pareciendo pistola en CADA frame, no
        // basta con haberla visto una vez. Sin esto, un solo frame con
        // ruido — por ejemplo, una mano de cuadrilátero que por un instante
        // se parece a una pistola — fijaba la identidad por posición para
        // siempre (ver más abajo), y el cuadrilátero se quedaba "secuestrado"
        // por el modo arco aunque la mano volviera enseguida a su pose
        // normal. Re-clasificar acá hace que ese ruido de un solo frame no
        // alcance a acumular el tiempo de armado (BOW_ARM_HOLD_MS): en
        // cuanto la mano deja de parecer pistola, se resetea el conteo.
        //
        // EXACTAMENTE una mano tiene que parecer pistola. Si las DOS
        // parecen pistola a la vez (el cuadrilátero también se puede hacer
        // con las dos manos en esa pose, apuntando hacia arriba — se ve
        // bien y es válido), es el gesto normal de cuadrilátero, no el
        // arco — sin este chequeo, ruido de un solo frame en el que una de
        // las dos manos no se clasifica del todo bien (aunque la otra sí)
        // hacía que se armara el arco por error mientras se hacía
        // cuadrilátero con esa pose.
        const gunHands = allHands.filter((lm) => isGunHand(lm));
        return gunHands.length === 1 ? gunHands[0] : null;
      }

      // Ya armado de verdad (se sostuvo la pose el tiempo suficiente): a
      // partir de acá nos quedamos con la mano más cercana a su última
      // posición conocida, en vez de seguir reclasificando la pose cada
      // frame. Esto es a propósito distinto de arriba — mientras se tensa
      // el arco con la otra mano, la pose de la mano pistola puede
      // relajarse un poco sin que eso signifique que cambió de mano, y
      // reclasificar cada frame en ESTA etapa era lo que causaba el bug de
      // "se confunden las manos" (ver historial en PLAN.md).
      let closest = null, closestDist = Infinity;
      for (const lm of allHands) {
        const d = Math.hypot(lm[0].x - gunHandRefPos.x, lm[0].y - gunHandRefPos.y);
        if (d < closestDist) { closestDist = d; closest = lm; }
      }
      return closestDist <= GUN_HAND_MATCH_MAX_DIST ? closest : null;
    }

    function launchTriangle(now) {
      triLaunchStartAt = now;
      setColorMixTarget(1, now); // anima uMix hacia el efecto completo — ver EFECTO DE COLOR: SHADER
      colorEffectActive = true;
      colorEffectActivatedAt = now; // ver SNAP_IGNORE_MS
      // El disparo termina el ciclo de armado — hay que volver a sostener
      // la pose de pistola para el próximo tiro, no queda "armado" para
      // siempre.
      resetBowCycle();
    }
    function resetColorEffect(now) {
      setColorMixTarget(0, now); // anima uMix de vuelta a video normal
      colorEffectActive = false;
      // Ya no importa en la práctica (el Acto 1 completo queda atrás, ver
      // abajo) pero se deja por si algún día se agrega una forma de
      // "reabrir" el Acto 1.
      bowGateOpen = false;
      // El chasquido es el final del Acto 1: se "olvida" todo lo que
      // estaba fijado hasta ahora (mismo mecanismo que el gesto de
      // borrado por codo) y arranca el Acto 2, donde solo existe la gema.
      clearAllStamped();
      hideShape(quadShape);
      hideShape(triShape);
      actTwoActive = true;
      // La cámara empieza a deslizarse hacia abajo acá mismo, en paralelo
      // con la animación de uMix de arriba — de acá en más, pantalla
      // negra con solo la gema (ver startCameraSlide/updateCameraSlideAnimation).
      startCameraSlide(now);
    }

    function updateArrowhead(gunHandLm, pinchHandLm, timestamp) {
      // La flecha tiene que ESTIRARSE de verdad entre las dos manos al
      // tensar (como la cuerda de un arco), no vivir entera en una sola
      // mano. Primer intento: pulgar+índice del PELLIZCO como los dos
      // puntos "anchos" — se veía como una línea delgada, no un triángulo,
      // porque esos dos dedos están juntos por definición mientras se
      // pellizca (eso es lo que hace que sea un pellizco). Correguido:
