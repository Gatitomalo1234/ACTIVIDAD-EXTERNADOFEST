      //   - los DOS puntos separados (pulgar + índice) vienen de la mano
      //     PISTOLA — ahí sí están bien abiertos (pulgar arriba, índice al
      //     frente), nunca colapsan entre sí sin importar el pellizco.
      //   - el pellizco de la OTRA mano aporta un solo punto (su centro) —
      //     ese es el que se aleja al tensar, estirando el triángulo.
      // Todavía sin la segunda mano (armando, esperando), se usa la muñeca
      // de la MISMA mano pistola como reemplazo provisional del tercer
      // punto (una flechita quieta, "guardada", hasta que aparezca la otra
      // mano). stampable:false — ver updateShapeVertices.
      const points = pinchHandLm
        ? [gunHandLm[4], gunHandLm[8], {
            x: (pinchHandLm[4].x + pinchHandLm[8].x) / 2,
            y: (pinchHandLm[4].y + pinchHandLm[8].y) / 2
          }]
        : [gunHandLm[4], gunHandLm[8], gunHandLm[0]];
      updateShapeVertices(triShape, arrowFilters, points, timestamp, { stampable: false });
    }

    function updateBowAndArrow(gunHandLm, pinchHandLm, canLaunch, now) {
      updateArrowhead(gunHandLm, pinchHandLm, now); // la flecha sigue a AMBAS manos, no solo a la pistola
      showShape(triShape, now);
      hideShape(quadShape);
      // Prende la "ventana" al efecto — el sincronizado de posición/escala/
      // opacidad frame a frame corre en el loop principal (syncArrowMesh),
      // no acá, para que siga el ritmo del render y no el de detección.
      arrowMesh.visible = true;

      if (!canLaunch) {
        // Todavía sosteniendo la pose para armar (no pasó BOW_ARM_HOLD_MS) —
        // se muestra la flecha ya para que se sienta responsivo, pero no se
        // evalúa pellizco/disparo todavía.
        bowPinchWasClosed = false;
        lastPinchRatio = null;
        lastDrawRatio = null;
        setHandStatus('arco (armando…)', 'ok');
        return;
      }

      if (!pinchHandLm) {
        // Ya armado, pero solo se ve la mano pistola — esperando la otra
        // mano para poder tensar. No hay pellizco que evaluar aún.
        bowPinchWasClosed = false;
        lastPinchRatio = null;
        lastDrawRatio = null;
        setHandStatus('arco (armado, falta la otra mano)', 'ok');
        return;
      }

      const pRatio = pinchRatio(pinchHandLm, 4, 8);
      // Zona muerta entre CLOSED y OPEN: mientras el ratio esté ahí en
      // medio, se mantiene el último estado conocido en vez de titubear.
      const pinchClosed = pRatio < PINCH_CLOSED_RATIO ? true : (pRatio > PINCH_OPEN_RATIO ? false : bowPinchWasClosed);

      const scale = (handScale(gunHandLm) + handScale(pinchHandLm)) / 2;
      const gunAnchor = gunHandLm[0]; // muñeca de la mano pistola
      const pinchPoint = {
        x: (pinchHandLm[4].x + pinchHandLm[8].x) / 2,
        y: (pinchHandLm[4].y + pinchHandLm[8].y) / 2
      };
      const drawRatio = Math.hypot(gunAnchor.x - pinchPoint.x, gunAnchor.y - pinchPoint.y) / scale;
      lastPinchRatio = pRatio; // ver comentario junto a la declaración — el debug se arma en el loop, no acá
      lastDrawRatio = drawRatio;

      if (bowPinchWasClosed && !pinchClosed && drawRatio >= MIN_DRAW_RATIO) {
        launchTriangle(now);
      }
      bowPinchWasClosed = pinchClosed;
      setHandStatus('arco (' + (pinchClosed ? 'tensando' : 'listo') + ')', 'ok');
    }

    // Copia posición/escala/opacidad de triShape.mesh a arrowMesh cada
    // frame de render (no cada detección) — así la "ventana" sigue el pop-in
    // Y la animación de disparo (updateLaunchAnimation) sin necesitar lógica
    // propia para ninguna de las dos: solo refleja lo que sea que ya haya
    // calculado triShape ese frame.
    function syncArrowMesh() {
      if (!arrowMesh.visible) return;
      arrowMesh.position.copy(triShape.mesh.position);
      arrowMesh.scale.copy(triShape.mesh.scale);
      arrowUniforms.uOpacity.value = triShape.material.opacity;
    }

    function updateLaunchAnimation(now) {
      const t = (now - triLaunchStartAt) / LAUNCH_DURATION_MS;
      if (t >= 1) {
        hideShape(triShape);
        triLaunchStartAt = null;
        return;
      }
      const eased = t * t; // acelera — se siente más como un disparo que un deslizamiento
      triShape.mesh.scale.setScalar(1 + eased * 2.5);
      triShape.mesh.position.z = eased * 4; // "sale" de la pantalla hacia la cámara
      triShape.material.opacity = 1 - eased;
    }

    function checkSnapReset(allHands, now) {
      // Recibe TODAS las manos, sin filtrar puños a propósito (ver
      // comentario en el loop principal) — la mano que chasquea dobla el
      // medio hacia el pulgar, lo que puede leerse como puño para el
      // detector genérico, pero acá es justo el gesto esperado.
      if (!colorEffectActive || now - colorEffectActivatedAt < SNAP_IGNORE_MS) {
        // El segundo caso (recién disparado) es a propósito — ver
        // SNAP_IGNORE_MS: la mano relajándose después de soltar el
        // pellizco no debe leerse como un chasquido.
        snapPinchWasClosed = false;
        return;
      }
      const anyClosed = allHands.some((lm) => pinchRatio(lm, 4, 12) < SNAP_CLOSED_RATIO);
      if (snapPinchWasClosed && !anyClosed) {
        resetColorEffect(now);
      }
      snapPinchWasClosed = anyClosed;
    }

    // ========== LOOP PRINCIPAL ==========
    const handStatusEl = document.getElementById('hand-status');
    const elbowStatusEl = document.getElementById('elbow-status');
    const fpsEl = document.getElementById('fps');
    const stampedStatusEl = document.getElementById('stamped-status');
    const bowDebugEl = document.getElementById('bow-debug');
    const DEBUG_BOW = true; // ver comentario en el HTML de #bow-debug — quitar cuando los umbrales queden confirmados

    // Fábrica de setters de estado: evita reescribir el DOM cuando el texto
    // no cambió. Importa sobre todo para el codo — `checkElbowClearGesture`
    // corre en CADA frame (~60/seg), así que sin este filtro se estaría
    // reescribiendo `innerHTML` constantemente aunque diga lo mismo.
    function makeStatusSetter(el, label) {
      let last = null;
      return (text, cls) => {
        const key = text + '|' + cls;
        if (key === last) return;
        last = key;
        el.innerHTML = label + ': <span class="' + cls + '">' + text + '</span>';
      };
    }
    const setHandStatus = makeStatusSetter(handStatusEl, 'Manos');
    const setElbowStatus = makeStatusSetter(elbowStatusEl, 'Codo');

    let frames = 0, lastFpsTime = performance.now();

    // `detectForVideo` de manos mide en vivo ~19-23ms con 2 manos a 1080p —
    // más que el presupuesto de un frame a 60 FPS (16.7ms). Correrla cada
    // tick topa el render entero a ~40-53 FPS, medido. La solución no es
    // hacer la detección más rápida (no hay modelo más liviano para
    // hand_landmarker, y darle un canvas más chico en vez del <video>
    // resultó ser MÁS lento, no menos — MediaPipe tiene un camino optimizado
    // para leer `<video>` directamente que un canvas no aprovecha) — es
    // desacoplarla del render: se detecta cada `DETECT_EVERY_N` frames, pero
    // se renderiza SIEMPRE. Con esto: 40-53 FPS -> 52-58 FPS.
    //
    // El pose (para el codo) corre a una frecuencia MUCHO menor todavía
    // (`POSE_DETECT_EVERY_N`) — el gesto de pasar el codo es deliberado, no
    // necesita 30Hz como el tracking de dedos, y sumar un segundo modelo
    // corriendo tan seguido como el de manos hubiera repetido el mismo
    // problema de rendimiento que ya se resolvió.
    const DETECT_EVERY_N = 2;
    const POSE_DETECT_EVERY_N = 16; // ~3-4 veces por segundo a 60 FPS de render
    let frameCounter = 0;

    // Todo el procesamiento de manos de un tick vive acá — se extrajo de
    // tick() para que esa función se pueda leer de un vistazo como
    // "orquestación del frame" (detectar, procesar, animar, renderizar)
    // sin tener que bucear entre gestos para llegar al render. Las tres
    // figuras están siempre disponibles en paralelo, diferenciadas solo por
    // la pose de las manos — no hay fases ni orden obligatorio:
    //   - exactamente una mano en pose "pistola" (+ opcionalmente la otra
    //     pellizcando) -> arco (se evalúa primero acá mismo).
    //   - lo que no sea arco se delega a processQuadAndTriangle(): 2 manos
    //     (incluye "dos pistolas hacia arriba", ver isGunHand/pickGunHand)
    //     -> cuadrilátero; 1 mano -> triángulo.
    function processHandDetection(allHands, now) {
      checkSnapReset(allHands, now);

      if (actTwoActive) {
        // El chasquido ya pasó: se acabó el Acto 1. De acá en adelante
        // (para el resto de la sesión) solo existe la gema del Acto 2 —
        // ver ACTO 2 más abajo.
        processActTwo(allHands, now);
        return;
      }

      if (triLaunchStartAt !== null) {
        // La flecha está en pleno vuelo — no se actualiza nada más
        // hasta que termine la animación de disparo.
        return;
      }

      if (colorEffectActive) {
        // Ya se disparó: el sistema queda bloqueado hasta el chasquido
        // (ya evaluado arriba, checkSnapReset corre siempre). No se
        // vuelve a armar el arco ni se procesa cuadrilátero/triángulo/
        // puño — si no, con las manos todavía en la misma posición de
        // después de disparar, el triángulo se volvía a armar solo.
        setHandStatus('esperando chasquido…', 'ok');
        return;
      }

      if (DEBUG_BOW) {
        // Detalle por mano (¿cada una clasifica como pistola? ¿qué
        // tan pellizcada está?) — más útil para diagnosticar que solo
        // el resumen, si hace falta seguir ajustando umbrales.
        const perHand = allHands
          .map((lm) => (isGunHand(lm) ? 'PISTOLA' : 'no') + '/p' + pinchRatio(lm, 4, 8).toFixed(2))
          .join('  ');
        let txt = 'estado:' + bowState + ' [' + perHand + ']';
        if (lastPinchRatio !== null) {
          txt += ' tensado:' + lastDrawRatio.toFixed(2) + '(min ' + MIN_DRAW_RATIO + ')';
        }
        bowDebugEl.textContent = txt;
      }

      // Compuerta del arco: tras un chasquido queda cerrada hasta que se
      // suelte la pose de "exactamente una pistola" (con las manos crudas,
      // sin pasar por pickGunHand — no queremos que la continuidad de
      // identidad la mantenga "vista" indefinidamente). Se compara contra
      // !== 1, no contra "ninguna mano parece pistola": si el cuadrilátero
      // se hace con las DOS manos en pose de pistola (ver pickGunHand), esa
      // pose nunca tendría "cero manos pistola" y la compuerta se quedaría
      // cerrada para siempre.
      if (!bowGateOpen && allHands.filter((lm) => isGunHand(lm)).length !== 1) {
        bowGateOpen = true;
      }
      const gunHandLm = bowGateOpen ? pickGunHand(allHands) : null;

      if (gunHandLm) {
        // Se ve una mano pistola: se muestra la flecha YA (se siente
        // responsivo) aunque todavía no se haya cumplido el tiempo de
        // armado — así se evita el destello del triángulo normal
        // (muñeca+índice+meñique, el que se ve mal en esta pose)
        // durante la ventana de armado. El pellizco/disparo solo se
        // habilita una vez armado de verdad (canLaunch).
        gunHandRefPos = { x: gunHandLm[0].x, y: gunHandLm[0].y }; // mantiene la identidad estable frame a frame
        gunHandLostAt = null;
        if (gunHandHoldStartedAt === null) gunHandHoldStartedAt = now;
        if (bowState !== 'armed' && now - gunHandHoldStartedAt >= BOW_ARM_HOLD_MS) {
          bowState = 'armed';
        }

        // Ninguna mano cuenta como puño acá por definición (isGunHand
        // e isFist ya son mutuamente excluyentes) — sin este reset,
        // anyHandIsFist se queda "pegado" en lo último que valía ANTES
        // de entrar en modo arco, y si el codo sigue visible (se seguiría
        // viendo, corre aparte) podría disparar el borrado sin que se
        // haga el gesto de verdad durante toda la sesión de arco.
        anyHandIsFist = false;

        const pinchHandLm = allHands.find((lm) => lm !== gunHandLm) || null;
        updateBowAndArrow(gunHandLm, pinchHandLm, bowState === 'armed', now);
        return;
      }

      gunHandHoldStartedAt = null;

      if (bowState === 'armed') {
        // No se ve la pistola este frame, pero seguimos armados: se
        // tolera un ratito (parpadeo normal de tracking) antes de
        // desarmar del todo — no se cae al primer frame en que
        // MediaPipe dude. Mientras tanto NO se procesa cuadrilátero/
        // triángulo/puño — seguimos protegiendo el modo arco.
        anyHandIsFist = false; // mismo razonamiento que arriba
        if (gunHandLostAt === null) gunHandLostAt = now;
        setHandStatus('arco (mano pistola perdida)', 'bad');
        if (now - gunHandLostAt >= BOW_EXIT_HOLD_MS) {
          resetBowCycle();
          hideShape(triShape);
        }
        return;
      }

      // Ni pistola ni arco en curso: cuadrilátero/triángulo/puño normal.
      processQuadAndTriangle(allHands, now);
    }

    function processQuadAndTriangle(allHands, now) {
      // Una mano en puño NO cuenta para el tracking — da "espacio
      // libre" para moverse sin que nada trackee ni se fije. Si de 2
      // manos mostradas una está en puño, queda 1 mano usable (pasa a
      // modo triángulo con la mano abierta); si las dos están en puño
      // (o no hay manos), no se trackea nada. Una sola pasada: separa
      // en usables/puños en vez de llamar isFist() dos veces por mano.
      const usableHands = [];
      anyHandIsFist = false;
      for (const lm of allHands) {
        if (isFist(lm)) anyHandIsFist = true;
        else usableHands.push(lm);
      }
      const count = usableHands.length;

      if (count === 2) {
        // Ordenar por X para asignar "izquierda"/"derecha" de forma
        // estable (no depende de la etiqueta Left/Right de MediaPipe —
        // así el lado izquierdo de la malla siempre corresponde a la
        // mano que está visualmente a la izquierda).
        const [a, b] = usableHands;
        const [leftHandLm, rightHandLm] = a[0].x <= b[0].x ? [a, b] : [b, a];
        updateQuad(leftHandLm, rightHandLm, now);
        showShape(quadShape, now);
        hideShape(triShape);
        setHandStatus('cuadrilátero (2 manos)', 'ok');
      } else if (count === 1) {
        showShape(triShape, now);
        updateTriangle(usableHands[0], now);
        hideShape(quadShape);
        setHandStatus('triángulo (1 mano)', 'ok');
      } else {
        hideShape(quadShape);
        hideShape(triShape);
        setHandStatus(allHands.length > 0 ? 'pausado (puño)' : 'buscando…', 'bad');
      }
    }

    // ========== ACTO 2 (post-chasquido) ==========
    // Arranca cuando resetColorEffect() marca actTwoActive = true. A
    // propósito NO reutiliza processQuadAndTriangle ni ninguna lógica del
    // Acto 1 — cuadrilátero, triángulo, arco y la pausa por puño quedan
    // "olvidados" (ver clearAllStamped() en resetColorEffect): de acá en
    // adelante el único gesto que se reconoce es dos manos ABIERTAS
    // (ninguna en puño), que arma la gema. Cualquier otra combinación
    // simplemente no hace nada — no hay a dónde volver.
    function processActTwo(allHands, now) {
      // Mismo tratamiento de puño que el Acto 1, para que el gesto de
      // borrado (puño + codo) se mantenga disponible acá también en vez
      // de quedarse pegado en lo último que valía antes del chasquido.
      anyHandIsFist = allHands.some((lm) => isFist(lm));
      const openHands = allHands.filter((lm) => !isFist(lm));

      if (openHands.length === 2) {
        // Orden estable por X (misma idea que el cuadrilátero, ver
        // processQuadAndTriangle) — sin esto, si el orden crudo de
        // MediaPipe cambia de frame a frame, los filtros de muñeca/
        // apertura verían saltar su fuente de una mano a la otra.
        const [a, b] = openHands;
        const [handLeft, handRight] = a[0].x <= b[0].x ? [a, b] : [b, a];
        updateGem(handLeft, handRight, now);
        showShape(gemShape, now);
        setHandStatus('gema (2 manos abiertas)', 'ok');
      } else {
        hideShape(gemShape);
        setHandStatus(allHands.length > 0 ? 'gema (mostrá las 2 manos abiertas)' : 'buscando…', 'bad');
      }
    }

    function loop(handLandmarker, poseLandmarker) {
      function tick() {
        requestAnimationFrame(tick);
        frameCounter++;
        const now = performance.now();

        if (videoEl.readyState >= 2 && frameCounter % POSE_DETECT_EVERY_N === 0) {
          const poseResult = poseLandmarker.detectForVideo(videoEl, now);
          elbowVisible = isElbowVisible(poseResult.landmarks);
        }

        if (videoEl.readyState >= 2 && frameCounter % DETECT_EVERY_N === 0) {
          const result = handLandmarker.detectForVideo(videoEl, now);
          processHandDetection(result.landmarks || [], now);
        }

        // El gesto de borrado se revisa en CADA tick (no solo cuando corre
        // alguna detección) porque acumula tiempo sostenido — usa el último
        // valor conocido de elbowVisible/anyHandIsFist, sin esperar a que
        // ambas detecciones coincidan en el mismo frame.
        checkElbowClearGesture(now);

        // El pop-in y el render corren SIEMPRE, aunque este tick no haya
        // corrido detección — es lo que mantiene todo a 60 FPS reales.
        updatePopAnimation(quadShape, now);
        updatePopAnimation(gemShape, now);
        if (triLaunchStartAt !== null) {
          updateLaunchAnimation(now);
        } else {
          updatePopAnimation(triShape, now);
        }
        syncArrowMesh(); // copia posición/escala/opacidad de triShape.mesh YA actualizadas este frame
        updateColorMixAnimation(now);
        updateCameraSlideAnimation(now);
        renderBoth();

        frames++;
        if (now - lastFpsTime > 1000) {
          fpsEl.textContent = frames + ' FPS';
          if (stampedStatusEl.textContent !== '¡BORRADO!') {
            stampedStatusEl.textContent = 'Fijadas: ' + stampedShapes.length + '/' + MAX_STAMPED_SHAPES;
          }
          frames = 0;
          lastFpsTime = now;
        }
      }
      tick();
    }

    async function main() {
      setHandStatus('cargando modelo…', 'bad');
      const [{ handLandmarker, poseLandmarker }] = await Promise.all([loadLandmarkers(), startCamera()]);
      setHandStatus('buscando…', 'bad');
      loop(handLandmarker, poseLandmarker);
    }

    main().catch((err) => {
      console.error(err);
      setHandStatus('ERROR: ' + err.message, 'bad');
    });
  </script>
</body>
</html>
